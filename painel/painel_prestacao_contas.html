<style>

--pendente-bg:#EDF0EF;--trabalhando-bg:#FBF0E0;--concluido-bg:#E6EEF7;--revisado-bg:#E4F2E9;

--ground:#111A1E;--surface:#182226;--surface-2:#1E2A2F;--ink:#E4EDEA;--muted:#93A6A6;

--pendente:#8B9997;--trabalhando:#D9931F;--concluido:#6BA3DC;--revisado:#4FB877;
--pendente-bg:#212B2E;--trabalhando-bg:#33280F;--concluido-bg:#16283A;--revisado-bg:#14301F;
--sombra:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
/* display:flex nas barras de ferramenta vence o display:none do atributo
   hidden -- sem esta regra as duas abas mostram a barra ao mesmo tempo */
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-size:14px;line-height:1.45;
font-family:"Libre Franklin",-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{background:var(--slate);color:var(--slate-txt);padding:14px 16px}
.cab{max-width:1180px;margin-inline:auto;display:flex;flex-wrap:wrap;gap:16px;align-items:baseline}
h1{margin:0;font-size:17px;font-weight:600}
.sub{font-size:12px;color:#9FB2AF}
.barra{max-width:1180px;margin:12px auto 0;display:flex;height:9px;border-radius:5px;
overflow:hidden;background:#31454D}
.legenda{max-width:1180px;margin:8px auto 0;display:flex;flex-wrap:wrap;gap:14px;font-size:12px}
.legenda span{display:inline-flex;align-items:center;gap:6px;color:#B8C8C5}
.ponto{width:9px;height:9px;border-radius:50%;flex:none}
.abas{max-width:1180px;margin:14px auto 0;padding-inline:16px;display:flex;gap:6px}
.aba{font:inherit;font-size:13px;font-weight:500;padding:7px 14px;cursor:pointer;background:transparent;
color:var(--muted);border:1px solid transparent;border-radius:8px}
.aba:hover{color:var(--ink);background:var(--surface-2)}
.aba[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;
border-color:var(--line);box-shadow:var(--sombra)}
.ferr{max-width:1180px;margin:14px auto 0;padding-inline:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);
border:1px solid var(--line-forte);border-radius:7px;padding:7px 10px}
input[type=search]{flex:1 1 220px;min-width:0}
.botao{font:inherit;font-size:13px;padding:7px 12px;cursor:pointer;color:var(--ink);
background:var(--surface);border:1px solid var(--line-forte);border-radius:7px;flex:none}
.botao:hover{background:var(--surface-2)}
.recado{max-width:1180px;margin:12px auto 0;padding:0 16px;font-size:12px;color:var(--muted)}
main{max-width:1180px;margin-inline:auto;padding:14px 16px 48px}
.anexo,details.no{background:var(--surface);border:1px solid var(--line);border-radius:10px;
box-shadow:var(--sombra);margin-bottom:10px;overflow:hidden}
details.no details{border:0;border-top:1px solid var(--line);border-radius:0;margin:0;box-shadow:none;background:none}
.anexo-cab,.no>summary{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:11px 14px;
cursor:pointer;background:none;border:0;width:100%;text-align:left;color:inherit;font:inherit;list-style:none}
.anexo-cab:hover,.no>summary:hover{background:var(--surface-2)}
.no>summary::-webkit-details-marker{display:none}
.no>summary::before{content:"\25B8";color:var(--muted);flex:none;transition:transform .15s}
details.no[open]>summary::before{transform:rotate(90deg)}
.cod{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);
border:1px solid var(--line);border-radius:5px;padding:2px 7px;flex:none}
.tit{font-weight:600;flex:1 1 240px;min-width:0}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.mini{display:flex;height:6px;width:104px;border-radius:3px;overflow:hidden;background:var(--pendente-bg);flex:none}
.qt{font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.seta{color:var(--muted);flex:none}
.corpo{border-top:1px solid var(--line)}
.vol-tit{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
color:var(--muted);padding:10px 14px 4px}
.rolagem{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
text-align:left;padding:6px 14px;border-bottom:1px solid var(--line)}
td{padding:7px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.sel{font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px;white-space:nowrap;
border:1px solid currentColor}
.sel-pendente{color:var(--pendente);background:var(--pendente-bg)}
.sel-trabalhando{color:var(--trabalhando);background:var(--trabalhando-bg)}
.sel-concluido{color:var(--concluido);background:var(--concluido-bg)}
.sel-revisado{color:var(--revisado);background:var(--revisado-bg)}
.fonte,.det{font-size:12px;color:var(--muted)}
details.pasta>summary{padding-left:28px;font-size:13px}
details.pasta .tit{font-weight:500}
details.tab>summary{padding:4px 0 4px 10px;font-size:12px;color:var(--muted)}
ul.arq{list-style:none;margin:0;padding:2px 0 10px 48px}
ul.arq>li{padding:4px 0}
.linha-arq{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.nome-arq{font-size:13px;word-break:break-word;font-weight:500}
.chip{font-size:11px;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);flex:none}
.chip.comp{color:var(--revisado);border-color:currentColor}
.chip.velha{color:var(--trabalhando);border-color:currentColor}
.caminho{font-size:11px;color:var(--muted);word-break:break-all}
ul.tabs{list-style:none;margin:0;padding:2px 0 6px 18px}
ul.tabs li{font-size:12px;color:var(--muted);padding:2px 0}
ul.tabs b{font-family:ui-monospace,Consolas,monospace;font-weight:500;color:var(--ink)}
.sem-arq,.vazio{color:var(--muted);font-size:13px;padding:10px 14px 14px 48px}
.vazio{text-align:center;padding:28px 14px}
footer{max-width:1180px;margin-inline:auto;padding:0 16px 40px;color:var(--muted);font-size:12px}
@media (max-width:620px){.mini,.qt{display:none}}
</style></head><body>
<div id="_gate" style="display:none;position:fixed;inset:0;z-index:9999;
  background:#0d1b3e;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif">
  <div style="background:#162550;border:1px solid #1e3267;border-radius:14px;
    padding:40px 48px;min-width:300px;max-width:400px;text-align:center;width:90%">
    <div style="font-size:30px;margin-bottom:12px">&#128274;</div>
    <div style="color:#fff;font-size:16px;font-weight:700;margin-bottom:4px">
      Controles Cont&aacute;beis</div>
    <div style="color:#9ab0cc;font-size:12px;margin-bottom:24px">GDF &middot; CONTDF</div>
    <input id="_gpw" type="password" placeholder="Senha de acesso"
      style="width:100%;padding:10px 14px;border:1px solid #1e3267;border-radius:8px;
      background:#0d1b3e;color:#fff;font-size:14px;outline:none;margin-bottom:12px;
      box-sizing:border-box">
    <button id="_gbtn"
      style="width:100%;padding:10px;background:#0090a8;color:#fff;border:none;
      border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">Entrar</button>
    <div id="_gerr" style="color:#f87171;font-size:12px;margin-top:10px;min-height:16px"></div>
  </div>
</div>
<script>
(function(){
  var H="2bea89a49ae0f463aa32710bb5d4d3d2118613e0b822d7fcc6d09ca5c9e402b2",K="gate_"+H.slice(0,8);
  var g=document.getElementById('_gate');
  if(!g) return;
  if(sessionStorage.getItem(K)===H){return;}
  g.style.display='flex';
  document.body.style.overflow='hidden';
  var inp=document.getElementById('_gpw');
  var btn=document.getElementById('_gbtn');
  var err=document.getElementById('_gerr');
  function ok(){g.style.display='none';document.body.style.overflow='';}
  async function check(){
    var enc=new TextEncoder().encode(inp.value);
    var buf=await crypto.subtle.digest('SHA-256',enc);
    var hex=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    if(hex===H){sessionStorage.setItem(K,H);ok();}
    else{err.textContent='Senha incorreta.';inp.value='';inp.focus();}
  }
  btn.addEventListener('click',check);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  inp.focus();
})();
</script>

  {id:"trabalhando", rot:"Trabalhando", cor:"var(--trabalhando)"},
  {id:"concluido",   rot:"Concluído",   cor:"var(--concluido)"},
  {id:"revisado",    rot:"Revisado",    cor:"var(--revisado)"}
];

function el(tag, cls, txt){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}
function chave(a, v, i){ return (a+"_"+v+"_"+i).replace(/[^A-Za-z0-9_-]/g, "-"); }
function itemEstado(k){ return ESTADO[k] || {status:"pendente", resp:""}; }

var abertos = {};

function todosItens(){
  var out = [];
  CAT.forEach(function(a){ a.vols.forEach(function(v){ v.itens.forEach(function(i){
    out.push({a:a, v:v, i:i, k:chave(a.id, v.id, i.id)});
  }); }); });
  return out;
}
function filtros(){
  return {q:document.getElementById("busca").value.trim().toLowerCase(),
          s:document.getElementById("f-status").value,
          r:document.getElementById("f-resp").value};
}
function passa(reg, f){
  var e = itemEstado(reg.k), resp = e.resp || reg.a.resp || "";
  if (f.s && e.status !== f.s) return false;
  if (f.r && resp !== f.r) return false;
  if (f.q){
    var alvo = (reg.i.t+" "+reg.a.t+" "+reg.a.id+" "+reg.i.f+" "+resp).toLowerCase();
    if (alvo.indexOf(f.q) < 0) return false;
  }
  return true;
}
function contar(regs){
  var c = {pendente:0, trabalhando:0, concluido:0, revisado:0};
  regs.forEach(function(r){ var s = itemEstado(r.k).status; c[s] = (c[s]||0)+1; });
  return c;
}
function pintarBarra(elt, c, total){
  elt.textContent = "";
  STATUS.forEach(function(s){
    var d = document.createElement("div");
    d.style.background = s.cor;
    d.style.width = total ? (c[s.id]/total*100)+"%" : "0";
    d.title = s.rot+": "+c[s.id];
    elt.appendChild(d);
  });
}

function desenhar(){
  var f = filtros(), main = document.getElementById("lista");
  var regs = todosItens(), c = contar(regs);
  pintarBarra(document.getElementById("barra"), c, regs.length);
  var leg = document.getElementById("legenda");
  leg.textContent = "";
  STATUS.forEach(function(s){
    var sp = el("span");
    var p = el("i", "ponto"); p.style.background = s.cor;
    sp.appendChild(p);
    sp.appendChild(document.createTextNode(s.rot+" "));
    sp.appendChild(el("b", "mono", c[s.id]));
    leg.appendChild(sp);
  });

  main.textContent = "";
  var visiveis = 0;
  CAT.forEach(function(a){
    var regsA = [];
    a.vols.forEach(function(v){ v.itens.forEach(function(i){
      regsA.push({a:a, v:v, i:i, k:chave(a.id, v.id, i.id)}); }); });
    var vis = regsA.filter(function(r){ return passa(r, f); });
    if (!vis.length) return;
    visiveis += vis.length;

    var card = el("section", "anexo");
    var cab = el("button", "anexo-cab"); cab.type = "button";
    cab.setAttribute("aria-expanded", abertos[a.id] ? "true" : "false");
    cab.appendChild(el("span", "cod mono", a.id));
    cab.appendChild(el("span", "tit", a.t));
    var meta = el("span", "meta");
    meta.appendChild(el("span", "", "origem: "+(a.origem||"—")));
    meta.appendChild(el("span", "", "resp.: "+(a.resp||"—")));
    cab.appendChild(meta);
    var mini = el("span", "mini"); pintarBarra(mini, contar(regsA), regsA.length);
    cab.appendChild(mini);
    cab.appendChild(el("span", "qt",
      vis.length + (vis.length === regsA.length ? "" : "/"+regsA.length) + " itens"));
    cab.appendChild(el("span", "seta", abertos[a.id] ? "\u25BE" : "\u25B8"));
    cab.addEventListener("click", function(){ abertos[a.id] = !abertos[a.id]; desenhar(); });
    card.appendChild(cab);

    if (abertos[a.id]){
      var corpo = el("div", "corpo");
      a.vols.forEach(function(v){
        var linhas = v.itens.map(function(i){
          return {a:a, v:v, i:i, k:chave(a.id, v.id, i.id)};
        }).filter(function(r){ return passa(r, f); });
        if (!linhas.length) return;
        var bloco = el("div", "vol");
        if (a.vols.length > 1 || v.t !== "Volume Único")
          bloco.appendChild(el("div", "vol-tit", v.t));
        var rol = el("div", "rolagem"), tb = el("table");
        var thead = el("thead"), trh = el("tr");
        ["Item","Fonte","Formato","Situação","Responsável"].forEach(function(h){
          trh.appendChild(el("th", "", h)); });
        thead.appendChild(trh); tb.appendChild(thead);
        var tbody = el("tbody");
        linhas.forEach(function(r){
          var e = itemEstado(r.k), tr = el("tr");
          tr.appendChild(el("td", "tit", r.i.t));
          tr.appendChild(el("td", "fonte", r.i.f || "—"));
          tr.appendChild(el("td", "fonte mono", r.i.fm || "—"));
          var td = el("td");
          var b = el("span", "sel sel-"+e.status, ROT[e.status] || e.status);
          if (e.em) b.title = "marcado em "+e.em;
          td.appendChild(b);
          tr.appendChild(td);
          tr.appendChild(el("td", "fonte", e.resp || r.a.resp || "—"));
          tbody.appendChild(tr);
        });
        tb.appendChild(tbody); rol.appendChild(tb); bloco.appendChild(rol);
        corpo.appendChild(bloco);
      });
      card.appendChild(corpo);
    }
    main.appendChild(card);
  });
  if (!visiveis) main.appendChild(el("div", "vazio", "Nenhum item corresponde ao filtro."));
}
var ROT = {pendente:"Pendente", trabalhando:"Trabalhando",
           concluido:"Concluído", revisado:"Revisado"};

function popularResp(){
  var sel = document.getElementById("f-resp"), vistos = {};
  todosItens().forEach(function(r){
    var v = itemEstado(r.k).resp || r.a.resp || "";
    if (v && v !== "—") vistos[v] = 1;
  });
  Object.keys(vistos).sort().forEach(function(v){
    var o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o);
  });
}

/* ── mapa ────────────────────────────────────────────────────── */
function linhaTabelas(f){
  var velhas = f.tabelas.filter(function(t){ return t.fonte === "docx2025"; }).length;
  var d = el("details", "no tab"), s = el("summary");
  s.appendChild(el("span", "qt", f.tabelas.length+" tabela(s) neste documento"));
  if (velhas) s.appendChild(el("span", "chip velha", velhas+" ainda de 2025"));
  d.appendChild(s);
  var ul = el("ul", "tabs");
  f.tabelas.forEach(function(t){
    var li = el("li");
    li.appendChild(el("b", "", "{{TABELA:"+t.m+"}}"));
    if (t.fonte === "xlsx")
      li.appendChild(document.createTextNode(" aba "+t.aba+" de "+t.de.split("/").pop()));
    else if (t.fonte === "docx2025"){
      var v = el("span", "", " ainda do documento de 2025");
      v.style.color = "var(--trabalhando)"; li.appendChild(v);
    } else if (t.fonte === "vazio")
      li.appendChild(document.createTextNode(" sem fonte"+(t.obs ? " — "+t.obs : "")));
    else li.appendChild(document.createTextNode(" "+(t.fonte||"sem fonte")));
    ul.appendChild(li);
  });
  d.appendChild(ul);
  return d;
}

function desenharMapa(){
  var alvo = document.getElementById("mapa");
  alvo.textContent = "";
  MAPA.anexos.forEach(function(a){
    var d = el("details", "no anexo-mapa");
    d.dataset.busca = (a.id+" "+a.t+" "+a.dir).toLowerCase();
    var s = el("summary");
    s.appendChild(el("span", "cod mono", a.id));
    s.appendChild(el("span", "tit", a.t));
    s.appendChild(el("span", "qt", a.n ? a.n+" arquivo(s)" : "vazio"));
    d.appendChild(s);
    if (!a.pastas.length)
      d.appendChild(el("div", "sem-arq", a.dir
        ? "Nenhum arquivo ainda — material que vem de outra área."
        : "Pasta do anexo não encontrada."));
    a.pastas.forEach(function(p){
      var dp = el("details", "no pasta"), sp = el("summary");
      sp.appendChild(el("span", "tit", p.t));
      sp.appendChild(el("span", "qt", p.n+""));
      dp.appendChild(sp);
      var ul = el("ul", "arq");
      p.arquivos.forEach(function(f){
        var li = el("li");
        li.dataset.busca = (f.n+" "+p.t+" "+a.t+" "+a.id).toLowerCase();
        var linha = el("div", "linha-arq");
        linha.appendChild(el("span", "nome-arq", f.n));
        linha.appendChild(el("span", "chip", f.fm));
        if (f.comp) linha.appendChild(el("span", "chip comp", f.comp));
        linha.appendChild(el("span", "det",
          f.kb.toLocaleString("pt-BR")+" KB · "+f.em));
        li.appendChild(linha);
        li.appendChild(el("div", "caminho", f.rel));
        if (f.tabelas.length) li.appendChild(linhaTabelas(f));
        ul.appendChild(li);
      });
      dp.appendChild(ul);
      d.appendChild(dp);
    });
    alvo.appendChild(d);
  });
  var nada = el("div", "vazio", "Nenhum arquivo corresponde ao filtro.");
  nada.id = "mapa-vazio"; nada.hidden = true;
  alvo.appendChild(nada);
}

function filtrarMapa(){
  var q = document.getElementById("busca-mapa").value.trim().toLowerCase();
  var achou = false;
  Array.prototype.forEach.call(document.querySelectorAll("details.anexo-mapa"), function(d){
    var naoAnexo = q && d.dataset.busca.indexOf(q) < 0;
    var algum = !q;
    Array.prototype.forEach.call(d.querySelectorAll("li[data-busca]"), function(li){
      var ok = !q || !naoAnexo || li.dataset.busca.indexOf(q) >= 0;
      li.hidden = !ok;
      if (ok) algum = true;
    });
    if (q && !naoAnexo) algum = true;
    d.hidden = !algum;
    Array.prototype.forEach.call(d.querySelectorAll("details.pasta"), function(dp){
      var vis = Array.prototype.some.call(dp.querySelectorAll("li[data-busca]"),
        function(li){ return !li.hidden; });
      dp.hidden = q ? !vis : false;
      if (q) dp.open = vis;
    });
    if (q && algum) d.open = true;
    if (algum) achou = true;
  });
  document.getElementById("mapa-vazio").hidden = achou;
}

function abrirTudo(abrir){
  Array.prototype.forEach.call(
    document.getElementById("mapa").querySelectorAll("details"),
    function(d){ d.open = abrir; });
}

function verAba(v){
  var m = v === "mapa";
  document.getElementById("lista").hidden = m;
  document.getElementById("ferr-situacao").hidden = m;
  document.getElementById("mapa").hidden = !m;
  document.getElementById("ferr-mapa").hidden = !m;
  document.getElementById("aba-situacao").setAttribute("aria-selected", m ? "false" : "true");
  document.getElementById("aba-mapa").setAttribute("aria-selected", m ? "true" : "false");
  document.getElementById("recado").textContent = m
    ? MAPA.total+" arquivos na pasta de trabalho, levantados em "+MAPA.gerado
      +" · o caminho aparece a partir da pasta do balanço"
    : "Cópia para consulta: a situação abaixo é a fotografia de "+SNAP.lido_em
      +". Marcar e atribuir continua sendo feito no painel interno.";
}

desenhar();
popularResp();
desenharMapa();
verAba("situacao");
["busca","f-status","f-resp"].forEach(function(id){
  document.getElementById(id).addEventListener("input", desenhar); });
Array.prototype.forEach.call(document.querySelectorAll(".aba[data-v]"), function(b){
  b.addEventListener("click", function(){ verAba(b.dataset.v); }); });
document.getElementById("busca-mapa").addEventListener("input", filtrarMapa);
document.getElementById("abrir-tudo").addEventListener("click", function(){ abrirTudo(true); });
document.getElementById("fechar-tudo").addEventListener("click", function(){ abrirTudo(false); });
document.getElementById("rodape").textContent =
  "Catálogo montado a partir da IN TCDF nº 1/2016 · situação lida em "+SNAP.lido_em
  +" · arquivos levantados em "+MAPA.gerado+" · página gerada em 06/10/2026 17:08";
</script>
</body></html>
