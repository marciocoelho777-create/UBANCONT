  --pg:#080C18; --s1:#101827; --s2:#182035; --bd:#1D2C48;
  --t1:#D4DFF5; --t2:#6A7EA6; --t3:#3D5070;
  --err:#F87171; --err-bg:#170404; --err-bd:#7F1D1D;
  --wrn:#FBBA47; --wrn-bg:#140C00; --wrn-bd:#78350F;
  --ok:#4ADE80;  --ok-bg:#031309;  --ok-bd:#14532D;
  --inf:#93C5FD; --inf-bg:#0C1A35; --inf-bd:#1E3A5F;
}}
:root[data-theme="dark"]{
  --navy:#0d1b3e; --navy-mid:#162550; --navy-light:#1e3267;
  --brand:#00b8d4; --brand-l:#4dd0e1;
  --pg:#080C18; --s1:#101827; --s2:#182035; --bd:#1D2C48;
  --t1:#D4DFF5; --t2:#6A7EA6; --t3:#3D5070;
  --err:#F87171; --err-bg:#170404; --err-bd:#7F1D1D;
  --wrn:#FBBA47; --wrn-bg:#140C00; --wrn-bd:#78350F;
  --ok:#4ADE80;  --ok-bg:#031309;  --ok-bd:#14532D;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);font-size:14px;line-height:1.5;color:var(--t1);background:var(--pg)}

/* ── Header ── */
.hd{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:3px solid var(--brand)}
.hd-title{font-size:15px;font-weight:700;letter-spacing:-.01em}
.hd-sub{font-size:12px;opacity:.72;margin-top:2px}
.hd-meta{font-size:11px;text-align:right;opacity:.75;line-height:1.65}
.hd-meta strong{color:#fff;opacity:1}

/* ── Tipo selector ── */
.tipo-bar{background:var(--navy-mid);padding:0 24px;display:flex;align-items:stretch;gap:2px;overflow-x:auto;border-bottom:1px solid var(--navy-light)}
.tipo-tab{background:transparent;border:none;color:rgba(255,255,255,.60);font-family:var(--fn);font-size:13px;font-weight:500;padding:11px 18px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tipo-tab:hover{color:rgba(255,255,255,.90)}
.tipo-tab.active{color:#fff;border-bottom-color:var(--brand-l)}
.tipo-badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle}
.tb-err{background:rgba(192,57,43,.35);color:#fca5a5}
.tb-alr{background:rgba(154,97,0,.35);color:#fde68a}
.tb-ok{background:rgba(26,122,68,.25);color:#86efac}

/* ── Wrap ── */
.wrap{max-width:960px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:20px}

/* ── KPI strip ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-stripe,var(--brand))}
.kpi-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:6px}
.kpi-val{font-size:24px;font-weight:700;letter-spacing:-.025em;color:var(--kpi-color,var(--t1))}
.kpi-sub{font-size:12px;color:var(--t2);margin-top:4px}

/* ── Problema cards ── */
.err-card{background:var(--err-bg);border:1px solid var(--err-bd);border-radius:var(--r);overflow:hidden}
.err-hd{background:var(--err);color:#fff;padding:11px 20px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.alr-card{background:var(--wrn-bg);border:1px solid var(--wrn-bd);border-radius:var(--r);overflow:hidden}
.alr-hd{background:#b45309;color:#fff;padding:11px 20px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.prob-body{padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.prob-item{font-size:13px;color:var(--t2);line-height:1.5;border-left:3px solid var(--err-bd);padding-left:10px}
.prob-item code{font-family:var(--fm);font-size:12px;background:rgba(0,0,0,.05);padding:1px 4px;border-radius:3px}

/* ── Module grid ── */
.mod-row{display:flex;gap:10px;flex-wrap:wrap}
.mod-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s;min-width:80px;box-shadow:var(--shadow)}
.mod-card:hover,.mod-card.active{border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,144,168,.18)}
.mod-name{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:4px}
.mod-chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px}
.c-err{background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.c-alr{background:var(--wrn-bg);color:var(--wrn);border:1px solid var(--wrn-bd)}
.c-ok {background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-bd)}
.c-inf{background:var(--inf-bg);color:var(--inf);border:1px solid var(--inf-bd)}

/* ── Table section ── */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.card-hd{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:600;color:var(--t1)}
.fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fbar-lbl{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.fbtn{background:transparent;border:1px solid var(--bd);border-radius:20px;color:var(--t2);font-size:12px;padding:3px 10px;cursor:pointer;transition:all .15s}
.fbtn:hover{border-color:var(--brand);color:var(--brand)}
.fbtn.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.f-sep{width:1px;height:18px;background:var(--bd);margin:0 2px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--navy);color:rgba(255,255,255,.80);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--navy-mid)}
tbody tr{border-bottom:1px solid var(--bd)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--s2)}
td{padding:9px 12px;vertical-align:top}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.st-ERRO  {background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.st-ALERTA{background:var(--wrn-bg);color:var(--wrn);border:1px solid var(--wrn-bd)}
.st-OK    {background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-bd)}
.st-INFO  {background:var(--inf-bg);color:var(--inf);border:1px solid var(--inf-bd)}
.cod{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--t1)}
.det{font-size:12px;color:var(--t2);line-height:1.55}
.empty{text-align:center;padding:32px;color:var(--t3);font-size:13px}

/* ── Select bar ── */
.tipo-select-bar{background:var(--navy-mid);padding:8px 24px;display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--navy-light)}
.tipo-select-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.60);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
#tipo-select{padding:5px 14px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:var(--navy-light);color:#fff;font-size:13px;font-family:var(--fn);cursor:pointer;min-width:240px}
#tipo-select option{background:var(--navy);color:#fff}

/* ── Norma badge ── */
.norma{font-size:11px;color:var(--inf);font-style:italic;max-width:300px;line-height:1.4}

/* ── Consolidado matrix ── */
.matrix-wrap{overflow-x:auto}
table.matrix th,table.matrix td{padding:7px 10px;white-space:nowrap}
table.matrix th{background:var(--navy);color:rgba(255,255,255,.80);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;border-bottom:1px solid var(--navy-mid)}
table.matrix td:first-child{white-space:normal;font-size:12.5px;font-weight:600;min-width:120px}
table.matrix td.cod-cell{font-family:var(--fm);font-size:11.5px}
table.matrix tr:hover td{background:var(--s2)}

/* ── Info bar ── */
.info-bar{background:var(--inf-bg);border:1px solid var(--inf-bd);border-radius:var(--r);padding:12px 18px;font-size:12px;color:var(--inf);display:flex;align-items:center;gap:10px}

/* ── Footer ── */
footer{text-align:center;font-size:12px;color:var(--t3);padding:28px 20px 20px;border-top:1px solid var(--bd);margin-top:8px}

@media(max-width:600px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .tipo-tab{padding:10px 12px;font-size:12px}
}
</style>

    <input id="_gpw" type="password" placeholder="Senha de acesso"
      style="width:100%;padding:10px 14px;border:1px solid #1e3267;border-radius:8px;
      background:#0d1b3e;color:#fff;font-size:14px;outline:none;margin-bottom:12px;
      box-sizing:border-box">
    <button id="_gbtn"
      style="width:100%;padding:10px;background:#0090a8;color:#fff;border:none;
      border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">Entrar</button>
    <div id="_gerr" style="color:#f87171;font-size:12px;margin-top:10px;min-height:16px"></div>
  </div>
</div>
<script>
(function(){
  var H="2bea89a49ae0f463aa32710bb5d4d3d2118613e0b822d7fcc6d09ca5c9e402b2",K="gate_"+H.slice(0,8);
  var g=document.getElementById('_gate');
  if(!g) return;
  if(sessionStorage.getItem(K)===H){return;}
  g.style.display='flex';
  document.body.style.overflow='hidden';
  var inp=document.getElementById('_gpw');
  var btn=document.getElementById('_gbtn');
  var err=document.getElementById('_gerr');
  function ok(){g.style.display='none';document.body.style.overflow='';}
  async function check(){
    var enc=new TextEncoder().encode(inp.value);
    var buf=await crypto.subtle.digest('SHA-256',enc);
    var hex=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    if(hex===H){sessionStorage.setItem(K,H);ok();}
    else{err.textContent='Senha incorreta.';inp.value='';inp.focus();}
  }
  btn.addEventListener('click',check);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  inp.focus();
})();
</script>

/* ── Regras somáveis ──────────────────────────────────────────────────────
   Em BF-01, DFC-01 e X2 o valor do consolidado é a SOMA dos tipos, não o
   valor do pior tipo. Sem isto a linha consolidada herdava o detalhe do
   primeiro tipo em ERRO — BF-01 exibia os 296.611,96 da Direta (que se
   anulam contra as Autarquias) em vez dos 6.419,17 do GDF inteiro.
   A soma dos 7 tipos bate ao centavo com o que o diag.py apura direto do
   banco (Ingressos 75.477.908.453,06 / Dispêndios 75.477.902.033,89). */
const REGRAS_SOMAVEIS = {
  'BF-01':  {rotGap:'Diferença', rotA:'Ingressos', rotB:'Dispêndios',
             reA:/Ingressos\s+(-?[\d,]+\.\d{2})/i,
             reB:/Disp[êe]ndios\s+(-?[\d,]+\.\d{2})/i},
  'DFC-01': {rotGap:'Gap', rotA:'Geração', rotB:'Var.Caixa',
             reA:/Gera[cç][aã]o\s+(-?[\d,]+\.\d{2})/i,
             reB:/(?:Var\.Caixa|Varia[cç][aã]o)\s+(-?[\d,]+\.\d{2})/i},
  'X2':     {rotGap:'Gap', rotA:'Geração', rotB:'Var.Caixa',
             reA:/Gera[cç][aã]o\s+(-?[\d,]+\.\d{2})/i,
             reB:/Var\.Caixa\s+(-?[\d,]+\.\d{2})/i},
};

/* Soma cada regra somável ao longo dos tipos.
   Devolve Map: codigo -> {fecha, vistos, detalhe}.
   Usado nos DOIS lugares que consolidam (KPIs do topo e tabela), para que
   não voltem a divergir. */
function somarRegrasConsolidado(tipos){
  const _n = s => parseFloat(String(s).replace(/,/g,''));
  const _f = v => v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const out = new Map();
  Object.keys(REGRAS_SOMAVEIS).forEach(cod=>{
    const cfg = REGRAS_SOMAVEIS[cod];
    let somaA=0, somaB=0, somaGap=0, completo=true, vistos=0;
    tipos.forEach(t=>{
      const ach = (TIPOS_DATA[t].achados||[]).find(a=>a.c===cod);
      if(!ach) return;
      vistos++;
      const d = ach.d||'';
      const mA = d.match(cfg.reA), mB = d.match(cfg.reB);
      if(mA && mB){
        somaA += _n(mA[1]); somaB += _n(mB[1]); somaGap += _n(mA[1]) - _n(mB[1]);
        return;
      }
      // Tipo que só publica o gap (ex.: X2 quando OK escreve apenas "Gap: 0.00"):
      // dá para somar a diferença, mas não os componentes.
      const mG = d.match(/(?:Gap|Diferen[cç]a):\s*(-?[\d,]+\.\d{2})/i);
      if(mG) somaGap += _n(mG[1]);
      completo = false;
    });
    if(!vistos) return;
    out.set(cod, {
      fecha: Math.abs(somaGap) < 0.01,
      vistos,
      detalhe: (completo
        ? `${cfg.rotGap}: ${_f(somaGap)}  |  ${cfg.rotA} ${_f(somaA)}  ${cfg.rotB} ${_f(somaB)}`
        : `${cfg.rotGap}: ${_f(somaGap)}`) + `  (soma dos ${vistos} tipos)`,
    });
  });
  return out;
}

function renderConsolidado(){
  // totais por regra única (pior status entre tipos) — não soma por tipo
  const tipos = Object.keys(TIPOS_DATA).map(Number).sort((a,b)=>a-b);
  const _STATUS_RANK = {ERRO:3, ALERTA:2, OK:1, INFO:0};
  const _piorPorCod = new Map();
  tipos.forEach(t=>{
    (TIPOS_DATA[t].achados||[]).forEach(a=>{
      const atual = _piorPorCod.get(a.c)||'INFO';
      if((_STATUS_RANK[a.s]||0) > (_STATUS_RANK[atual]||0)) _piorPorCod.set(a.c, a.s);
    });
  });
  // BF-02 antecipado: somar gaps para decidir status no consolidado
  if(_piorPorCod.has('BF-02')){
    let _soma02=0;
    tipos.forEach(tipo=>{
      const ach=(TIPOS_DATA[tipo].achados||[]).find(a=>a.c==='BF-02');
      if(!ach) return;
      const d=ach.d||'';
      const mD=d.match(/Diferen[cç]a:\s*([-\d,.]+)/i);
      if(mD){_soma02+=parseFloat(mD[1].replace(/,/g,''));return;}
      const mS=d.match(/Saldo\s+([-\d,.]+)/i);
      if(mS){_soma02+=parseFloat(mS[1].replace(/,/g,''));}
    });
    _piorPorCod.set('BF-02', Math.abs(_soma02)<1.0 ? 'OK' : 'ALERTA');
  }
  // Regras somáveis: o status do consolidado vem da soma dos tipos, não do pior tipo
  somarRegrasConsolidado(tipos).forEach((r,cod)=>{
    if(r.fecha && _piorPorCod.has(cod)) _piorPorCod.set(cod,'OK');
  });
  let totalErro=0,totalAlr=0,totalOk=0,totalInf=0;
  _piorPorCod.forEach(s=>{ if(s==='ERRO')totalErro++; else if(s==='ALERTA')totalAlr++; else if(s==='OK')totalOk++; else totalInf++; });
  const totalTot = _piorPorCod.size;

  const mesEx = tipos.length ? (TIPOS_DATA[tipos[0]].mes||'') : '';
  const anoEx = tipos.length ? (TIPOS_DATA[tipos[0]].ano||'') : '';
  const comp = mesEx&&anoEx ? `${MESES[mesEx]||mesEx}/${anoEx}` : '—';
  document.getElementById('hd-sub').textContent = 'Consolidado — Todos os Tipos';
  document.getElementById('hd-data').textContent = tipos.length ? (TIPOS_DATA[tipos[0]].gerado_em||'—').replace('T',' ').substring(0,16) : '—';
  document.getElementById('hd-comp').textContent = comp;
  document.getElementById('footer').innerHTML =
    `Diagnóstico Contábil GDF · ${comp} · <code>diag_tipoagreg.py</code> · Visão Consolidada`;

  let h='';
  h+=`<div class="kpi-row">
    <div class="kpi" style="--kpi-stripe:var(--err);--kpi-color:${totalErro>0?'var(--err)':'var(--t1)'}">
      <div class="kpi-lbl">Erros</div><div class="kpi-val">${totalErro}</div>
      <div class="kpi-sub">em ${tipos.length} tipos</div></div>
    <div class="kpi" style="--kpi-stripe:var(--wrn-bd);--kpi-color:${totalAlr>0?'var(--wrn)':'var(--t1)'}">
      <div class="kpi-lbl">Alertas</div><div class="kpi-val">${totalAlr}</div>
      <div class="kpi-sub">&nbsp;</div></div>
    <div class="kpi" style="--kpi-stripe:var(--ok);--kpi-color:var(--ok)">
      <div class="kpi-lbl">OK</div><div class="kpi-val">${totalOk}</div>
      <div class="kpi-sub">de ${totalTot} controles</div></div>
    <div class="kpi" style="--kpi-stripe:var(--inf-bd);--kpi-color:var(--inf)">
      <div class="kpi-lbl">Informativos</div><div class="kpi-val">${totalInf}</div>
      <div class="kpi-sub">sem ação necessária</div></div>
  </div>`;

  // matrix por tipo
  h+=`<div class="card" data-st-oculta><div class="card-hd"><span class="card-title">Resumo por Tipo de Agregação</span></div>
    <div class="matrix-wrap"><table class="matrix">
      <thead><tr><th>Tipo</th><th>Erros</th><th>Alertas</th><th>OK</th><th>Info</th><th>Total</th></tr></thead>
      <tbody>`;
  tipos.forEach(t=>{
    const d=TIPOS_DATA[t], tot=d.totais||{};
    const rowErr=tot.ERRO||0;
    h+=`<tr>
      <td><strong>${t}</strong> — ${d.nome||'Tipo '+t}</td>
      <td style="color:${rowErr>0?'var(--err)':'inherit'};font-weight:${rowErr>0?700:400}">${rowErr||'—'}</td>
      <td>${tot.ALERTA||'—'}</td>
      <td style="color:var(--ok)">${tot.OK||'—'}</td>
      <td style="color:var(--inf)">${tot.INFO||'—'}</td>
      <td>${tot.TOTAL||(d.achados||[]).length}</td>
    </tr>`;
  });
  h+=`</tbody></table></div></div>`;

  // Agregar por código: uma linha por regra, pior status entre os tipos
  const STATUS_RANK = {ERRO:3, ALERTA:2, OK:1, INFO:0};
  // porCodigo -> {m, t, piorStatus, tiposProblema[], detalhePior, detalheRef}
  const porCodigo = new Map();
  tipos.forEach(tipo=>{
    const nomeTipo = TIPOS_DATA[tipo].nome || ('Tipo '+tipo);
    (TIPOS_DATA[tipo].achados||[]).forEach(a=>{
      if(!porCodigo.has(a.c)){
        porCodigo.set(a.c, {m:a.m, t:a.t, piorStatus:'INFO', tiposProblema:[], detalhePior:'', detalheRef:a.d||''});
      }
      const entry = porCodigo.get(a.c);
      if((STATUS_RANK[a.s]||0) > (STATUS_RANK[entry.piorStatus]||0)){
        entry.piorStatus = a.s;
        entry.detalhePior = a.d||'';
      }
      if(a.s !== 'OK' && a.s !== 'INFO') entry.tiposProblema.push({tipo, nome:nomeTipo, s:a.s, d:a.d||''});
    });
  });

  // BF-02: somar o gap (RECEB − CONC) de cada tipo.
  // Se a soma fechar ≈ 0, o consolidado está OK mesmo que cada tipo individualmente não bata.
  if(porCodigo.has('BF-02')){
    const e02 = porCodigo.get('BF-02');
    let somaGaps = 0;
    tipos.forEach(tipo=>{
      const ach = (TIPOS_DATA[tipo].achados||[]).find(a=>a.c==='BF-02');
      if(!ach) return;
      const d = ach.d||'';
      // Formato ALERTA (dados antigos): "Diferença: -6,520,014,454.11"
      const mDif = d.match(/Diferen[cç]a:\s*([-\d,.]+)/i);
      if(mDif){ somaGaps += parseFloat(mDif[1].replace(/,/g,'')); return; }
      // Formato INFO (novos dados): "Recebidas X  Concedidas Y  Saldo Z (label)"
      const mSaldo = d.match(/Saldo\s+([-\d,.]+)/i);
      if(mSaldo){ somaGaps += parseFloat(mSaldo[1].replace(/,/g,'')); return; }
      // Formato OK: "Recebidas X  =  Concedidas X" → gap = 0
    });
    if(Math.abs(somaGaps) < 1.0){
      e02.piorStatus = 'OK';
      e02.tiposProblema = [];
      e02.detalhePior = `Soma das transferências entre tipos = ${somaGaps.toFixed(2)} — equilibrado no consolidado`;
    } else {
      e02.piorStatus = 'ALERTA';
      e02.detalhePior = `Soma das diferenças entre tipos = ${somaGaps.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})} — cobertura incompleta`;
    }
  }

  // Regras somáveis: a linha consolidada exibe a soma dos tipos.
  // Os badges de "Tipos c/ problema" ficam — o consolidado pode fechar
  // enquanto tipos individuais não fecham entre si, e isso é achado.
  somarRegrasConsolidado(tipos).forEach((r,cod)=>{
    if(!porCodigo.has(cod)) return;
    const e = porCodigo.get(cod);
    e.detalhePior = r.detalhe + (r.fecha && e.tiposProblema.length
      ? ' — os tipos se compensam no consolidado' : '');
    if(r.fecha) e.piorStatus = 'OK';
  });

  // Ordem canônica dos módulos
  const MOD_ORDER = ['BF','BO','DVP','DMPL','BP','BAL','X'];
  const linhasConsolidadas = [...porCodigo.entries()].sort((a,b)=>{
    const ma=MOD_ORDER.indexOf(a[1].m), mb=MOD_ORDER.indexOf(b[1].m);
    return ma!==mb ? ma-mb : a[0].localeCompare(b[0]);
  });

  // Cards de problema consolidados
  const errosConsolidados = linhasConsolidadas.filter(([,e])=>e.piorStatus==='ERRO');
  const alertasConsolidados = linhasConsolidadas.filter(([,e])=>e.piorStatus==='ALERTA');
  if(errosConsolidados.length){
    h+=`<div class="err-card" data-st="ERRO"><div class="err-hd">✘ ${errosConsolidados.length} controle${errosConsolidados.length>1?'s':''} com erro</div><div class="prob-body">`;
    errosConsolidados.forEach(([cod,e])=>{
      const tipos_afet = e.tiposProblema.map(p=>p.nome).join(', ');
      h+=`<div class="prob-item"><code>${cod}</code> — ${e.t}<br><small style="color:var(--t3)">Tipos afetados: ${tipos_afet}</small></div>`;
    });
    h+=`</div></div>`;
  }
  if(alertasConsolidados.length){
    h+=`<div class="alr-card" data-st="ALERTA"><div class="alr-hd">⚠ ${alertasConsolidados.length} controle${alertasConsolidados.length>1?'s':''} com alerta</div><div class="prob-body">`;
    alertasConsolidados.forEach(([cod,e])=>{
      const tipos_afet = e.tiposProblema.map(p=>p.nome).join(', ');
      h+=`<div class="prob-item" style="border-left-color:var(--wrn-bd)"><code>${cod}</code> — ${e.t}<br><small style="color:var(--t3)">Tipos afetados: ${tipos_afet}</small></div>`;
    });
    h+=`</div></div>`;
  }

  h+=`<div class="card">
    <div class="card-hd"><span class="card-title">Controles — Visão Consolidada</span>
      <small style="color:var(--t3);font-size:11px;margin-left:8px">pior status entre os tipos · clique no tipo para detalhes individuais</small>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th style="width:32px"></th><th>Módulo</th><th>Código</th><th>Controle de Integridade</th><th>Tipos c/ problema</th><th>Detalhe</th><th>Norma/Regra</th></tr></thead>
      <tbody>${linhasConsolidadas.map(([cod,e])=>{
        const tiposProb = e.tiposProblema.length
          ? e.tiposProblema.map(p=>`<span class="chip ${p.s==='ERRO'?'c-err':'c-alr'}" style="font-size:10px;padding:1px 5px" title="${p.d.substring(0,200)}">${p.nome}</span>`).join(' ')
          : '<span style="color:var(--ok);font-size:11px">✔ todos OK</span>';
        const det = e.detalhePior || e.detalheRef || '';
        return `<tr data-st="${e.piorStatus}">
          <td><span class="st ${statusClass(e.piorStatus)}">${statusIcon(e.piorStatus)}</span></td>
          <td><strong>${MOD_LABEL[e.m]||e.m}</strong></td>
          <td class="cod">${cod}</td>
          <td>${e.t}</td>
          <td style="white-space:normal;min-width:140px">${tiposProb}</td>
          <td class="det">${det}</td>
          <td class="norma">${NORMAS[cod]||''}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;

  document.getElementById('wrap').innerHTML = h;
}

function selecionarTipo(t){
  tipoAtivo = t; statusFiltro = document.documentElement.dataset.filtro||'ALL'; modFiltro = null;
  document.querySelectorAll('.tipo-tab').forEach(b => b.classList.toggle('active', +b.dataset.tipo===t));
  const sel = document.getElementById('tipo-select');
  if(sel) sel.value = String(t);
  renderizar();
}

function renderizar(){
  const d = TIPOS_DATA[tipoAtivo];
  if (!d) return;
  const tot = d.totais||{}, achados = d.achados||[];
  const nErr=tot.ERRO||0, nAlr=tot.ALERTA||0, nOk=tot.OK||0, nInf=tot.INFO||0, nTot=tot.TOTAL||achados.length;
  const erros   = achados.filter(a=>a.s==='ERRO');
  const alertas = achados.filter(a=>a.s==='ALERTA');

  const comp = d.mes&&d.ano ? `${MESES[d.mes]||d.mes}/${d.ano}` : '—';
  document.getElementById('hd-sub').textContent = d.nome||`Tipo ${tipoAtivo}`;
  document.getElementById('hd-data').textContent = d.gerado_em ? d.gerado_em.replace('T',' ').substring(0,16) : '—';
  document.getElementById('hd-comp').textContent = comp;
  document.getElementById('footer').innerHTML =
    `Diagnóstico Contábil GDF · ${comp} · <code>diag_tipoagreg.py</code> · dados em <code>painel/dados/tipoagreg/</code>`;

  const modulos = [...new Set(achados.map(a=>a.m))];
  const modStats = {};
  modulos.forEach(m=>{ modStats[m]={ERRO:0,ALERTA:0,OK:0,INFO:0}; achados.filter(a=>a.m===m).forEach(a=>modStats[m][a.s]=(modStats[m][a.s]||0)+1); });

  let h='';
  // KPI
  h+=`<div class="kpi-row">
    <div class="kpi" style="--kpi-stripe:var(--err);--kpi-color:${nErr>0?'var(--err)':'var(--t1)'}">
      <div class="kpi-lbl">Erros</div><div class="kpi-val">${nErr}</div>
      <div class="kpi-sub">${nErr>0?erros.map(e=>e.c).join(', '):'Nenhum erro'}</div></div>
    <div class="kpi" style="--kpi-stripe:var(--wrn-bd);--kpi-color:${nAlr>0?'var(--wrn)':'var(--t1)'}">
      <div class="kpi-lbl">Alertas</div><div class="kpi-val">${nAlr}</div>
      <div class="kpi-sub">${nAlr>0?alertas.map(a=>a.c).join(', '):'—'}</div></div>
    <div class="kpi" style="--kpi-stripe:var(--ok);--kpi-color:var(--ok)">
      <div class="kpi-lbl">OK</div><div class="kpi-val">${nOk}</div>
      <div class="kpi-sub">de ${nTot} controles</div></div>
    <div class="kpi" style="--kpi-stripe:var(--inf-bd);--kpi-color:var(--inf)">
      <div class="kpi-lbl">Informativos</div><div class="kpi-val">${nInf}</div>
      <div class="kpi-sub">sem ação necessária</div></div>
  </div>`;

  // Cards de problema
  if(erros.length){
    h+=`<div class="err-card" data-st="ERRO"><div class="err-hd">✘ ${erros.length} erro${erros.length>1?'s':''} encontrado${erros.length>1?'s':''}</div><div class="prob-body">`;
    erros.forEach(e=>{ h+=`<div class="prob-item"><code>${e.c}</code> — ${e.t}${e.d?'<br><small style="color:var(--t3)">'+e.d.substring(0,160)+'</small>':''}</div>`; });
    h+=`</div></div>`;
  }
  if(alertas.length){
    h+=`<div class="alr-card" data-st="ALERTA"><div class="alr-hd">⚠ ${alertas.length} alerta${alertas.length>1?'s':''}</div><div class="prob-body">`;
    alertas.forEach(a=>{ h+=`<div class="prob-item" style="border-left-color:var(--wrn-bd)"><code>${a.c}</code> — ${a.t}${a.d?'<br><small style="color:var(--t3)">'+a.d.substring(0,160)+'</small>':''}</div>`; });
    h+=`</div></div>`;
  }

  // Grade de módulos
  h+=`<div class="mod-row" id="mod-row">`;
  modulos.forEach(m=>{
    const ms=modStats[m]; let chips='';
    if(ms.ERRO)   chips+=`<span class="chip c-err">${ms.ERRO} Erro${ms.ERRO>1?'s':''}</span>`;
    if(ms.ALERTA) chips+=`<span class="chip c-alr">${ms.ALERTA} Alerta${ms.ALERTA>1?'s':''}</span>`;
    if(ms.OK)     chips+=`<span class="chip c-ok">${ms.OK} OK</span>`;
    if(ms.INFO)   chips+=`<span class="chip c-inf">${ms.INFO} Info</span>`;
    h+=`<div class="mod-card${modFiltro===m?' active':''}" onclick="clickMod(this)" data-mod="${m}" title="Clique para filtrar">
      <div class="mod-name">${MOD_LABEL[m]||m}</div><div class="mod-chips">${chips}</div></div>`;
  });
  h+=`</div>`;

  // Tabela
  const fbarExtra = modFiltro ? `<div class="f-sep"></div><span class="fbar-lbl">Módulo: <strong>${MOD_LABEL[modFiltro]||modFiltro}</strong></span><button class="fbtn" onclick="clearMod()">× limpar</button>` : '';
  h+=`<div class="card">
    <div class="card-hd">
      <span class="card-title">Controles de Integridade</span>
      <div class="fbar">
        <span class="fbar-lbl">Status</span>
        ${['ALL','ERRO','ALERTA','OK','INFO'].map(s=>`<button class="fbtn${statusFiltro===s?' active':''}" onclick="setStatus(this,'${s}')">${{ALL:'Todos',ERRO:'Erros',ALERTA:'Alertas',OK:'OK',INFO:'Info'}[s]}</button>`).join('')}
        ${fbarExtra}
      </div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th style="width:32px"></th><th>Módulo</th><th>Código</th><th>Controle de Integridade</th><th>Norma/Regra</th><th>Detalhe</th></tr></thead>
      <tbody id="ctrl-body"></tbody>
    </table></div>
  </div>`;

  document.getElementById('wrap').innerHTML = h;
  renderTabela(achados);
}

function renderTabela(achados){
  const body = document.getElementById('ctrl-body');
  if(!body) return;
  const filt = achados.filter(a=>(statusFiltro==='ALL'||a.s===statusFiltro)&&(!modFiltro||a.m===modFiltro));
  if(!filt.length){ body.innerHTML=`<tr><td colspan="6" class="empty">Nenhum controle corresponde ao filtro.</td></tr>`; return; }
  body.innerHTML = filt.map(a=>`<tr data-st="${a.s}">
    <td><span class="st ${statusClass(a.s)}">${statusIcon(a.s)}</span></td>
    <td><strong>${MOD_LABEL[a.m]||a.m}</strong></td>
    <td class="cod">${a.c}</td>
    <td>${a.t}</td>
    <td class="norma">${NORMAS[a.c]||''}</td>
    <td class="det">${a.d||''}</td>
  </tr>`).join('');
}

function setStatus(btn,s){
  statusFiltro=s;
  document.querySelectorAll('.fbtn').forEach(b=>{
    const lbl={ALL:'Todos',ERRO:'Erros',ALERTA:'Alertas',OK:'OK',INFO:'Info'};
    if(Object.keys(lbl).some(k=>lbl[k]===b.textContent.trim())) b.classList.toggle('active',b.textContent.trim()===lbl[s]);
  });
  renderTabela(TIPOS_DATA[tipoAtivo]?.achados||[]);
  if(window.kpiFiltroSync) kpiFiltroSync(s);  // mantém os cards-filtro do topo iguais
}

/* card do topo clicado (saida/kpi_filtro.py) → mesmo filtro da tabela do tipo */
window.kpiFiltroHook=function(s){
  statusFiltro=s;
  const lbl={ALL:'Todos',ERRO:'Erros',ALERTA:'Alertas',OK:'OK',INFO:'Info'};
  document.querySelectorAll('.fbar .fbtn').forEach(b=>{
    if(Object.values(lbl).includes(b.textContent.trim())) b.classList.toggle('active',b.textContent.trim()===lbl[s]);
  });
  if(tipoAtivo!==null) renderTabela(TIPOS_DATA[tipoAtivo]?.achados||[]);
};

function clickMod(el){ const m=el.dataset.mod; modFiltro=(modFiltro===m?null:m); renderizar(); }
function clearMod(){ modFiltro=null; renderizar(); }

(function init(){
  if(!Object.keys(TIPOS_DATA).length){
    document.getElementById('wrap').innerHTML=`<div class="info-bar">ℹ Nenhum dado — execute <code>diag_tipoagreg.py --mes M --ano A --todos --json</code></div>`;
    return;
  }
  const maisRecente=Object.values(TIPOS_DATA).map(d=>d.gerado_em).filter(Boolean).sort().reverse()[0];
  if(maisRecente) document.getElementById('hd-data').textContent=maisRecente.replace('T',' ').substring(0,16);
  const m=TIPO_META.mes, y=TIPO_META.ano;
  if(m&&y) document.getElementById('hd-comp').textContent=`${MESES[m]||m}/${y}`;
  montarAbas();
})();
</script>
<!-- kpi-filtro:inicio -->
<style>
.kpi.kpi-clic{cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .12s}
.kpi.kpi-clic:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.10)}
.kpi.kpi-clic:focus-visible{outline:2px solid var(--kpi-stripe,var(--kpi,#2563eb));outline-offset:2px}
.kpi.kpi-on{box-shadow:0 0 0 2px var(--kpi-stripe,var(--kpi,#2563eb))}
html[data-filtro] .kpi.kpi-clic:not(.kpi-on){opacity:.5}
html[data-filtro] [data-st-oculta]{display:none!important}
#kpi-filtro-faixa{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:999;
  display:none;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:999px;
  background:#1f2937;color:#fff;font:600 13px/1.2 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);
  max-width:calc(100vw - 32px)}
html[data-filtro] #kpi-filtro-faixa{display:flex}
#kpi-filtro-faixa button{border:0;border-radius:999px;padding:5px 12px;background:#fff;color:#1f2937;
  font:600 12px system-ui,sans-serif;cursor:pointer}
@media print{#kpi-filtro-faixa{display:none!important}}
</style>
<div id="kpi-filtro-faixa" role="status"><span id="kpi-filtro-txt"></span><button type="button" onclick="kpiFiltrar(null)">× limpar filtro</button></div>
<script>
(function(){
  var MAPA={'erro':'ERRO','erros':'ERRO','alerta':'ALERTA','alertas':'ALERTA','ok':'OK',
            'informativo':'INFO','informativos':'INFO','info':'INFO'};
  var NOME={ERRO:'erros',ALERTA:'alertas',OK:'OK',INFO:'informativos'};
  var html=document.documentElement;
  // regras de ocultação geradas para o status ativo (aceita qualquer vocabulário de status)
  var css=document.createElement('style'); document.head.appendChild(css);
  function nomeDe(s){
    if(NOME[s]) return NOME[s];
    var k=document.querySelector('.kpi[data-filtro="'+s+'"] .kpi-lbl');
    return k?k.textContent.trim().toLowerCase():s;
  }
  function stDe(k){
    if(k.dataset.filtro) return k.dataset.filtro;
    var l=k.querySelector('.kpi-lbl');
    return l?MAPA[l.textContent.trim().toLowerCase()]:null;
  }
  function marcar(){
    var atual=html.dataset.filtro||null;
    document.querySelectorAll('.kpi').forEach(function(k){
      var s=stDe(k); if(!s) return;
      if(!k.classList.contains('kpi-clic')){
        k.classList.add('kpi-clic'); k.dataset.filtro=s; k.tabIndex=0; k.setAttribute('role','button');
        k.title=s==='ALL'?'Clique para mostrar tudo':'Clique para ver só '+nomeDe(s)+' (de novo para limpar)';
      }
      var on=s===atual; k.classList.toggle('kpi-on',on); k.setAttribute('aria-pressed',on?'true':'false');
    });
    var t=document.getElementById('kpi-filtro-txt');
    if(t&&atual){
      var n=0; document.querySelectorAll('[data-st="'+atual+'"]').forEach(function(e){ if(e.offsetParent!==null||e.getClientRects().length) n++; });
      var txt='Mostrando só '+nomeDe(atual)+(n?'':' — nenhum item nesta visão');
      if(t.textContent!==txt) t.textContent=txt;  // evita laço com o MutationObserver
    }
  }
  function aplicar(s){
    if(s) html.dataset.filtro=s; else delete html.dataset.filtro;
    var q=s?'"'+String(s).replace(/"/g,'')+'"':'';
    css.textContent=s?('[data-st]:not([data-st='+q+']),[data-st-grupo]:not(:has([data-st='+q+'])){display:none!important}'):'';
    if(s) document.querySelectorAll('details[data-st-grupo]').forEach(function(d){
      if(d.querySelector('[data-st="'+s+'"]')) d.open=true;
    });
    marcar();
  }
  window.kpiFiltroSync=function(s){ aplicar(s&&s!=='ALL'?s:null); };
  window.kpiFiltrar=function(s){
    if(s==='ALL'||s===(html.dataset.filtro||null)) s=null;
    aplicar(s);
    if(typeof window.kpiFiltroHook==='function') window.kpiFiltroHook(s||'ALL');
    marcar();
    if(s){
      var alvo=Array.prototype.find.call(document.querySelectorAll('[data-st="'+s+'"]'),function(e){return e.getClientRects().length;});
      if(alvo&&alvo.getBoundingClientRect().top>window.innerHeight*0.8) alvo.scrollIntoView({behavior:'smooth',block:'center'});
    }
  };
  document.addEventListener('click',function(e){
    var k=e.target.closest&&e.target.closest('.kpi.kpi-clic'); if(k) kpiFiltrar(k.dataset.filtro);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&html.dataset.filtro){ kpiFiltrar(null); return; }
    if(e.key!=='Enter'&&e.key!==' ') return;
    var k=e.target.closest&&e.target.closest('.kpi.kpi-clic'); if(k){ e.preventDefault(); kpiFiltrar(k.dataset.filtro); }
  });
  // páginas que re-renderizam os cards (troca de tipo/execução) são remarcadas na hora;
  // marcar() só mexe em atributos e só reescreve o texto da faixa se mudou, então não realimenta
  new MutationObserver(marcar).observe(document.body,{childList:true,subtree:true});
  marcar();
})();
</script>
