  async function check(){
    var enc=new TextEncoder().encode(inp.value);
    var buf=await crypto.subtle.digest('SHA-256',enc);

})();

function tipoBadgeClass(t){
  if(!t) return 'bt-Outro';
  t=t.toLowerCase();
  if(t.includes('lei')) return 'bt-Lei';
  if(t.includes('decreto')) return 'bt-Decreto';
  if(t.includes('portaria')) return 'bt-Portaria';
  if(t.includes('resolu')) return 'bt-Resolucao';
  if(t.includes('tcdf')) return 'bt-TCDF';
  if(t.includes('parecer')) return 'bt-Parecer';
  if(t.includes('manual')||t.includes('minuta')||t.includes('apostila')) return 'bt-Manual';
  if(t.includes('decis')) return 'bt-TCDF';
  return 'bt-Outro';
}

function renderCard(it){
  var ext = it.arquivo.split('.').pop().toLowerCase();
  var icon = ext==='pdf'?'📄':ext==='txt'?'📝':ext==='doc'||ext==='docx'?'📋':'📎';
  var link = it.existe
    ? '<a href="'+it.url+'" target="_blank">'+icon+' '+_e(it.titulo)+'</a>'
    : '<span title="Arquivo não encontrado" style="color:#6a8a9a">⚠ '+_e(it.titulo)+'</span>';
  var bc = tipoBadgeClass(it.tipo);
  var sc = 'bs-'+(it.status||'desconhecida').replace(/\s/g,'');
  var sits = (it.situacoes||[]).map(function(s){
    return '<span class="badge-sit">'+_e(s)+'</span>';
  }).join('');
  var ano = it.ano ? '<span class="card-ano">Ano: '+it.ano+'</span>' : '';
  var obs = it.obs ? '<div class="card-obs">'+_e(it.obs)+'</div>' : '';
  return '<div class="card">'
    +'<div class="card-header">'
    +'<div class="card-titulo">'+link+'</div>'
    +'<span class="badge-tipo '+bc+'">'+_e(it.tipo)+'</span>'
    +'</div>'
    +'<div class="card-assunto">'+_e(it.assunto)+'</div>'
    +'<div class="card-meta">'
    +'<span class="badge-status '+sc+'">'+_e(it.status||'desconhecida')+'</span>'
    +ano
    +'<div class="sits">'+sits+'</div>'
    +'</div>'
    +obs
    +'</div>';
}

function _e(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

function filtrar(){
  var q=(document.getElementById('busca').value||'').toLowerCase();
  var tipo=document.getElementById('sel-tipo').value;
  var status=document.getElementById('sel-status').value;
  var sit=document.getElementById('sel-consulta').value;

  var res=D.filter(function(it){
    if(q){
      var txt=(it.titulo+' '+it.assunto+' '+(it.obs||'')).toLowerCase();
      if(txt.indexOf(q)<0) return false;
    }
    if(tipo && it.tipo!==tipo) return false;
    if(status && it.status!==status) return false;
    if(sit && (it.situacoes||[]).indexOf(sit)<0) return false;
    return true;
  });

  var el=document.getElementById('cards');
  if(!res.length){
    el.innerHTML='<div class="no-results">Nenhum documento encontrado para os filtros aplicados.</div>';
  } else {
    el.innerHTML=res.map(renderCard).join('');
  }
  document.getElementById('st-qtd').textContent=res.length.toLocaleString('pt-BR');
}

function consultarSituacao(){
  // Limpa os outros filtros ao selecionar uma situação
  document.getElementById('busca').value='';
  document.getElementById('sel-tipo').value='';
  document.getElementById('sel-status').value='';
  filtrar();
}

function limpar(){
  document.getElementById('busca').value='';
  document.getElementById('sel-tipo').value='';
  document.getElementById('sel-status').value='';
  document.getElementById('sel-consulta').value='';
  filtrar();
}
