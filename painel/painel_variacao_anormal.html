<script>
(function(){
  var H="2bea89a49ae0f463aa32710bb5d4d3d2118613e0b822d7fcc6d09ca5c9e402b2",K="gate_"+H.slice(0,8);
  var g=document.getElementById('_gate');
  if(!g) return;
  if(sessionStorage.getItem(K)===H){return;}
  g.style.display='flex';
  document.body.style.overflow='hidden';
  var inp=document.getElementById('_gpw');
  var btn=document.getElementById('_gbtn');
  var err=document.getElementById('_gerr');
  function ok(){g.style.display='none';document.body.style.overflow='';}
  async function check(){
    var enc=new TextEncoder().encode(inp.value);
    var buf=await crypto.subtle.digest('SHA-256',enc);
    var hex=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    if(hex===H){sessionStorage.setItem(K,H);ok();}
    else{err.textContent='Senha incorreta.';inp.value='';inp.focus();}
  }
  btn.addEventListener('click',check);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  inp.focus();
})();
</script>

    if(fora(u[1],u[2],S.minug)&&(todas||!S.fug||String(u[0])===S.fug))r.push({dem:g.dem,g:g.k,gn:g.n,ga:g.a,gp:g.p,conta:c[0],cn:c[1],ca:c[2],cp:c[3],ug:u[0],a:u[1],p:u[2]});

function base(g){return g.dem==='BP'?'saldo '+mesN[D.mes]+'/'+D.ano+' × encerramento '+(D.ano-1):'acumulado jan–'+mesN[D.mes]+'/'+D.ano+' × jan–'+mesN[D.mes]+'/'+(D.ano-1)}
function barra(){
  return `<div class="bar">
  <div class="f"><label>Demonstrativo</label><select onchange="S.dem=this.value;draw()">${['TODOS','BP','DVP'].map(x=>`<option ${S.dem===x?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="f"><label>Variação mínima (%)</label><input type="number" min="10" step="5" value="${S.pct}" style="width:80px" onchange="S.pct=Math.max(10,+this.value||30);draw()"></div>
  <div class="f"><label>Valor mínimo do grupo (R$ mi)</label><input type="number" min="10" step="10" value="${S.min}" style="width:100px" onchange="S.min=Math.max(10,+this.value||50);draw()"></div>
  <div class="f"><label>Filtrar UG</label><select onchange="S.fug=this.value;S.ug=this.value||null;draw()" style="max-width:340px"><option value="">Todas as UGs</option>${[...new Set(itens(true).map(i=>String(i.ug)))].sort((a,b)=>(D.ugs[a]||'').localeCompare(D.ugs[b]||'')).map(u=>`<option value="${u}" ${S.fug===u?'selected':''}>${esc(ugn(u))}</option>`).join('')}</select></div>
  <div class="f"><label>Valor mínimo na UG (R$ mi)</label><input type="number" min="1" step="1" value="${S.minug}" style="width:100px" onchange="S.minug=Math.max(1,+this.value||10);draw()"></div></div>`}
function kpis(){
  const G=grupos(),I=itens(),U=new Set(I.map(i=>i.ug));
  document.getElementById('kpis').innerHTML=`<div class="kpi"><b>${G.length}</b><span>grupos fora do padrão</span></div><div class="kpi"><b>${I.length}</b><span>itens UG × conta</span></div><div class="kpi"><b>${U.size}</b><span>UGs a consultar</span></div>`;
  document.getElementById('sub').textContent=`Competência ${String(D.mes).padStart(2,'0')}/${D.ano} · sem intra · BP: saldo × encerramento ${D.ano-1}; DVP: jan–${mesN[D.mes]} × jan–${mesN[D.mes]} ${D.ano-1} · gerado em ${D.gerado}`}
const ORD={c:'v',d:-1};
function chave(c,x){return c==='g'?x.k:c==='d'?(x.dem||''):c==='p0'?x.p:c==='a'?x.a:c==='v'?Math.abs(x.a-x.p):c==='pc'?(x.p?Math.abs((x.a-x.p)/x.p):Infinity):0}
function ordena(arr){return arr.sort((x,y)=>{const A=chave(ORD.c,x),B=chave(ORD.c,y);return (A<B?-1:A>B?1:0)*ORD.d})}
function so(c){if(ORD.c===c)ORD.d*=-1;else{ORD.c=c;ORD.d=(c==='g'||c==='d')?1:-1}draw()}
function th(c,t,n){return `<th class="${n?'n ':''}ord" onclick="so('${c}')" title="Ordenar por ${t}">${t}${ORD.c===c?(ORD.d>0?' ▲':' ▼'):''}</th>`}
function vgr(){
  let h=barra()+`<p class="nota">Grupos (4 primeiros dígitos da conta) cuja variação passa dos dois critérios ao mesmo tempo. Clique no grupo para abrir as contas, e na conta para abrir as UGs. <b>% do grupo</b> mostra quanto da variação cada linha explica. Clique no nome de uma coluna para ordenar (Variação e % ordenam pelo valor absoluto).</p>`;
  const G=ordena(grupos().map(g=>Object.assign({},g,{k:g.k})));if(!G.length)return h+'<div class="ph">Nenhum grupo passa nos critérios.</div>';
  h+='<table><tr>'+th('d','Dem.')+th('g','Grupo')+th('p0','Anterior',1)+th('a','Atual',1)+th('v','Variação',1)+th('pc','%',1)+'<th>Documentos SIGGO (principais)</th></tr>';
  for(const g of G){const d=g.a-g.p,k='g'+g.dem+g.k,ab=S.abertos[k];
    h+=`<tr class="g" onclick="tg('${k}')"><td><span class="tag ${g.dem}">${g.dem}</span></td><td><span class="cod">${g.k}</span> ${esc(g.n)}</td><td class="n">${fmt(g.p)}</td><td class="n">${fmt(g.a)}</td><td class="n ${d>0?'up':'dn'}">${fmt(d)}</td><td class="n">${ptxt(g.a,g.p)}</td><td></td></tr>`;
    if(ab)for(const x of ordena(g.c.map(c=>({k:c[0],a:c[2],p:c[3],r:c}))).slice(0,25)){const c=x.r,dc=c[2]-c[3],kc=k+c[0],ac=S.abertos[kc];
      h+=`<tr class="c g" onclick="tg('${kc}')"><td></td><td>&nbsp;&nbsp;<span class="cod">${c[0]}</span> ${esc(c[1])}</td><td class="n">${fmt(c[3])}</td><td class="n">${fmt(c[2])}</td><td class="n ${dc>0?'up':'dn'}">${fmt(dc)}</td><td class="n">${ptxt(c[2],c[3])} <span class="mut">· ${(dc/(g.a-g.p)*100).toLocaleString('pt-BR',{maximumFractionDigits:0})}% do grupo</span></td><td></td></tr>`;
      if(ac)for(const y of ordena(c[4].filter(u=>!S.fug||String(u[0])===S.fug).map(u=>({k:ugn(u[0]),a:u[1],p:u[2],r:u}))).slice(0,20)){const u=y.r,du=u[1]-u[2];
        h+=`<tr class="u"><td></td><td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${esc(ugn(u[0]))}</td><td class="n">${fmt(u[2])}</td><td class="n">${fmt(u[1])}</td><td class="n ${du>0?'up':'dn'}">${fmt(du)}</td><td class="n">${ptxt(u[1],u[2])} <span class="mut">· ${(du/dc*100).toLocaleString('pt-BR',{maximumFractionDigits:0})}% da conta</span></td><td>${docs(c[0],u[0])}</td></tr>`}}}
  return h+'</table>'}
function tg(k){S.abertos[k]=!S.abertos[k];draw()}
function vug(){
  const I=itens(),m={};
  for(const i of I){const o=m[i.ug]||(m[i.ug]={n:0,t:0,g:new Set()});o.n++;o.t+=Math.abs(i.a-i.p);o.g.add(i.dem+i.g)}
  const OU=window._ou||(window._ou={c:'t',d:-1});const kf=(u,o)=>OU.c==='u'?ugn(u):OU.c==='n'?o.n:OU.c==='g'?o.g.size:o.t;const L=Object.entries(m).sort((x,y)=>{const A=kf(x[0],x[1]),B=kf(y[0],y[1]);return (A<B?-1:A>B?1:0)*OU.d});
  let h=barra()+`<p class="nota">UGs com itens (UG × conta) fora do padrão dentro dos grupos fora do padrão — a ordem sugere onde começar as visitas. Clique na UG para ver os itens, copiar o pedido de explicação ou baixar a planilha.</p>`;
  h+=`<div class="bar"><button class="b" onclick="csv(null)">Baixar CSV de todos os itens</button><button class="b" onclick="todasMsgs()">Baixar mensagens de todas as UGs (.txt)</button></div>`;
  h+='<table><tr>'+[['u','UG',0],['n','Itens',1],['g','Grupos',1],['t','Soma das variações (R$)',1]].map(([c,t,n])=>`<th class="${n?'n ':''}ord" onclick="sou('${c}')">${t}${OU.c===c?(OU.d>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
  for(const [u,o] of L){h+=`<tr class="g" onclick="S.ug='${u}';draw()"><td>${esc(ugn(u))}</td><td class="n">${o.n}</td><td class="n">${o.g.size}</td><td class="n">${fmt(o.t)}</td></tr>`;
    if(S.ug===u){const its=ordena(I.filter(i=>String(i.ug)===String(u)).map(i=>Object.assign({},i,{k:i.conta})));
      h+=`<tr><td colspan="4" style="background:var(--panel2)"><table><tr>`+th('d','Dem.')+th('g','Conta')+th('p0','Anterior',1)+th('a','Atual',1)+th('v','Variação',1)+th('pc','%',1)+`<th>Documentos SIGGO (principais)</th></tr>`+
      its.map(i=>`<tr><td><span class="tag ${i.dem}">${i.dem}</span></td><td><span class="cod">${i.conta}</span> ${esc(i.cn)}<br><span class="mut">grupo ${i.g} ${esc(i.gn)}</span></td><td class="n">${fmt(i.p)}</td><td class="n">${fmt(i.a)}</td><td class="n ${i.a>i.p?'up':'dn'}">${fmt(i.a-i.p)}</td><td class="n">${ptxt(i.a,i.p)}</td><td>${docs(i.conta,i.ug,5)}</td></tr>`).join('')+
      `</table><div class="bar" style="margin-top:8px"><button class="b" onclick="event.stopPropagation();csv('${u}')">Baixar CSV da UG</button><button class="b" onclick="event.stopPropagation();pedido('${u}')">Gerar mensagem de alerta</button></div><div id="ped"></div></td></tr>`}}
  return h+'</table>'}
function sou(c){const o=window._ou;if(o.c===c)o.d*=-1;else{o.c=c;o.d=c==='u'?1:-1}draw()}
function csv(u){
  const I=itens().filter(i=>u==null||String(i.ug)===String(u));
  const l=['Demonstrativo;Grupo;Nome do grupo;Conta;Nome da conta;UG;Nome da UG;Anterior;Atual;Variacao;Variacao %;Documentos SIGGO principais'];
  for(const i of I)l.push([i.dem,i.g,i.gn,i.conta,i.cn,i.ug,D.ugs[i.ug],Math.round(i.p),Math.round(i.a),Math.round(i.a-i.p),pctv(i.a,i.p)==null?'novo':pctv(i.a,i.p).toFixed(1),((D.docs||{})[i.conta+'|'+i.ug]||[]).slice(0,5).map(x=>x[0]+' ('+tdoc(x[0])+', ev '+x[1]+', R$ '+fmt(x[2])+')').join(' | ')].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';'));
  const b=new Blob(['﻿'+l.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='variacao_anormal_'+(u||'todas')+'_'+D.ano+String(D.mes).padStart(2,'0')+'.csv';a.click()}
const PRAZO={v:null};
function prazoPadrao(){if(PRAZO.v)return PRAZO.v;const d=new Date();let n=7;while(n>0){d.setDate(d.getDate()+1);if(d.getDay()%6)n--}return d.toISOString().slice(0,10)}
function dataBR(iso){const [a,m,d]=iso.split('-');return d+'/'+m+'/'+a}
function msgUG(u){
  const its=itens().filter(i=>String(i.ug)===String(u)).sort((a,b)=>Math.abs(b.a-b.p)-Math.abs(a.a-a.p));
  const nome=D.ugs[u]||'', mm=String(D.mes).padStart(2,'0'), L=[];
  const ex=D.ano, an=D.ano-1, pz=dataBR(prazoPadrao());
  L.push(`Assunto: Nota Explicativa dos saldos com variação relevante — ${nome} (UG ${u}) — competência ${mm}/${ex}`);
  L.push('');L.push('Mensagem:');L.push('Prezados(as) responsáveis,');L.push('');
  L.push(`No âmbito da elaboração das Demonstrações Contábeis e da Prestação de Contas Anual do exercício de ${ex}, a Unidade de Consolidação de Balanços identificou, na competência ${mm}/${ex}, variações relevantes nos saldos registrados por essa unidade em relação a ${an}, nas contas abaixo. Solicita-se a elaboração de Nota Explicativa, até ${pz}, referente a esses saldos.`);
  L.push('');
  L.push(`Base de comparação: Balanço Patrimonial (BP) = saldo de ${mesN[D.mes]}/${ex} × saldo do encerramento de ${an}; Demonstração das Variações Patrimoniais (DVP) = acumulado de janeiro a ${mesN[D.mes]}/${ex} × o mesmo período de ${an}. Valores em R$, sem operações intra-orçamentárias.`);
  L.push('');
  const gs={};for(const i of its){(gs[i.dem+i.g]=gs[i.dem+i.g]||{i,l:[]}).l.push(i)}
  let n=0;
  for(const k of Object.keys(gs)){const G=gs[k],i0=G.i;n++;
    L.push(`${n}. ${i0.dem} — Grupo ${i0.g} – ${i0.gn}`);
    L.push(`   GDF consolidado: R$ ${fmt(i0.gp)} (${an}) → R$ ${fmt(i0.ga)} (${ex}); variação R$ ${fmt(i0.ga-i0.gp)} (${ptxt(i0.ga,i0.gp)})`);
    for(const i of G.l.slice(0,12)){
      L.push(`   • Conta ${i.conta} – ${i.cn}`);
      L.push(`       Nessa UG: R$ ${fmt(i.p)} (${an}) → R$ ${fmt(i.a)} (${ex}); variação R$ ${fmt(i.a-i.p)} (${ptxt(i.a,i.p)})`);
      const dd=((D.docs||{})[i.conta+'|'+i.ug]||[]).slice(0,3);
      if(dd.length)L.push('       Principais documentos SIGGO: '+dd.map(x=>x[0]+' ('+tdoc(x[0])+', evento '+x[1]+', R$ '+fmt(x[2])+')').join('; '));
      const dc=i.ca-i.cp;
      L.push(`       Conta no GDF: R$ ${fmt(i.cp)} → R$ ${fmt(i.ca)}; variação R$ ${fmt(dc)} (${ptxt(i.ca,i.cp)}); essa UG responde por ${dc?(((i.a-i.p)/dc)*100).toLocaleString('pt-BR',{maximumFractionDigits:0}):'—'}% da variação da conta`);
    }
    if(G.l.length>12)L.push(`   (… mais ${G.l.length-12} conta(s) desta UG neste grupo, de menor valor)`);
    L.push('');
  }
  L.push('A Nota Explicativa deverá apresentar, em especial, as seguintes informações:');
  L.push('• principais movimentações ocorridas no período, por conta;');
  L.push(`• explicação objetiva acerca das variações significativas observadas entre ${an} e ${ex}, com o fato gerador e o documento de suporte (NL, NE, processo SEI);`);
  L.push('• se há ajuste, reclassificação ou regularização prevista, e em que prazo;');
  L.push('• qualquer outro fato relevante.');
  L.push('');
  L.push('Essas informações são indispensáveis para assegurar a adequada evidenciação contábil e o atendimento às exigências de controle interno e externo, no contexto da Prestação de Contas Anual. Variação elevada não significa, por si só, erro: a nota serve para registrar o fato que a explica.');
  L.push('');L.push('Permanecemos à disposição para eventuais esclarecimentos.');L.push('');
  L.push('Atenciosamente,');L.push('Equipe da Unidade de Consolidação de Balanços');L.push('Secretaria de Estado de Economia do Distrito Federal');
  return L.join('\n')}
function pedido(u){
  document.getElementById('ped').innerHTML=`<div class="bar" style="margin-top:8px"><div class="f"><label>Prazo para a nota</label><input type="date" value="${prazoPadrao()}" onclick="event.stopPropagation()" onchange="PRAZO.v=this.value;pedido('${u}')"></div><button class="b" onclick="event.stopPropagation();navigator.clipboard.writeText(document.getElementById('msg').value).then(()=>{this.textContent='Copiado ✔'})">Copiar mensagem</button></div><textarea id="msg" readonly onclick="event.stopPropagation();this.select()" style="height:420px">${esc(msgUG(u))}</textarea>`}
function todasMsgs(){
  const U=[...new Set(itens().map(i=>String(i.ug)))].sort((a,b)=>{const t=x=>itens().filter(i=>String(i.ug)===x).reduce((s,i)=>s+Math.abs(i.a-i.p),0);return t(b)-t(a)});
  const txt=U.map(u=>msgUG(u)).join('\n\n'+'='.repeat(78)+'\n\n');
  const b=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='mensagens_ugs_variacao_'+D.ano+String(D.mes).padStart(2,'0')+'.txt';a.click()}
function vcr(){return `<p class="nota">Um grupo aparece quando a variação passa dos <b>dois</b> critérios ao mesmo tempo (ajustáveis nas outras abas): percentual mínimo <b>e</b> valor mínimo — ou conta que não existia na base de comparação ("novo"). Valores abaixo de 10% ou R$ 10 milhões no grupo não são carregados no painel.</p>
<h3>Bases de comparação</h3><p class="nota"><b>BP</b>: saldo da competência × saldo do encerramento de ${D.ano-1} (saldo se compara com saldo).<br><b>DVP</b>: acumulado de janeiro até a competência × o mesmo período de ${D.ano-1} (fluxo se compara com fluxo; comparar com o ano cheio faria toda variação parecer queda).<br>Sem intra, como o Anexo I. Grupo = 4 primeiros dígitos da conta contábil. A coluna "% do grupo" (ou da conta) diz quanto da variação cada linha explica, o que indica onde está a origem.</p>
<h3>Como usar</h3><p class="nota">1) Em <i>Grupos de contas</i>, abra o grupo até a UG que concentra a variação. 2) Em <i>Por UG</i>, veja a ordem sugerida de visitas e gere a mensagem de alerta (pronta para enviar à unidade, com prazo editável) ou o CSV. 3) A variação grande nem sempre é erro: pode ser fato real (obra, reclassificação, regularização). O painel indica onde <b>perguntar</b>, não o que está errado.</p>`}
function aba(a){S.aba=a;for(const x of['gr','ug','cr'])document.getElementById('t-'+x).className=x===a?'on':'';draw()}
function draw(){kpis();document.getElementById('main').innerHTML=S.aba==='gr'?vgr():S.aba==='ug'?vug():vcr()}
draw();
</script>
</body>
</html>
