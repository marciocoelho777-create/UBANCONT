<script>
(function(){
  var H="2bea89a49ae0f463aa32710bb5d4d3d2118613e0b822d7fcc6d09ca5c9e402b2",K="gate_"+H.slice(0,8);
  var g=document.getElementById('_gate');
  if(!g) return;
  if(sessionStorage.getItem(K)===H){return;}
  g.style.display='flex';
  document.body.style.overflow='hidden';
  var inp=document.getElementById('_gpw');
  var btn=document.getElementById('_gbtn');
  var err=document.getElementById('_gerr');
  function ok(){g.style.display='none';document.body.style.overflow='';}
  async function check(){
    var enc=new TextEncoder().encode(inp.value);
    var buf=await crypto.subtle.digest('SHA-256',enc);
    var hex=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    if(hex===H){sessionStorage.setItem(K,H);ok();}
    else{err.textContent='Senha incorreta.';inp.value='';inp.focus();}
  }
  btn.addEventListener('click',check);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  inp.focus();
})();
</script>

const D={"ano":2026,"gerado_em":"22/10/2026 09:33","ugs":[[130201,"COMPANHIA DE PLANEJ. DO DISTRITO FEDERAL-CODEPLAN"],[130202,"BANCO DE BRASÍLIA S/A - BRB"],[130210,"DF - GESTÃO DE ATIVOS S.A."],[190201,"COMPANHIA URB. DA NOVA CAPITAL DO BRASIL-NOVACAP"],[190203,"COMPANHIA IMOBILIARIA DE BRASILIA - TERRACAP"],[190206,"COMPANHIA DE SANEAMENTO AMBIENTAL DO DF - CAESB"],[190208,"COMPANHIA ENERGÉTICA DE BRASÍLIA/CEB"],[200201,"SOCIED. DE TRANSP. COLETIVOS DE BRASILIA - TCB"],[200204,"COMPANHIA DO METROPOLITANO DO DF - METRÔ-DF"],[210202,"CENTRAL DE ABASTECIMENTO DE BRASÍLIA - CEASA"],[210203,"EMPRESA DE ASSIST. TÉC. E EXT. RURAL DO DF-EMATER"],[280209,"COMPANHIA DE DESENV. DA HABITAÇÃO  DO DF - CODHAB"],[320205,"SOCIEDADE DE ABASTECIMENTO DE BRASÍLIA - SAB"]],"regras":[["EST-01","ATIVO = PASSIVO + PATRIMÔNIO LÍQUIDO","Soma os itens analíticos do ativo (1x) e compara com a soma dos itens de passivo (21x, 22x) e patrimônio líquido (23x), em cada coluna do BP. O INTEGRA é digitado: não há partida dobrada, então nada impede que um lado seja lançado sem o outro. Diferença = balanço que não fecha.","Quase nunca. Diferença de poucos reais pode ser arredondamento de quem digita em reais inteiros (a tolerância do painel é R$ 1,00). Acima disso é erro de digitação ou lançamento incompleto.",["Lei 6.404/1976 art. 178 — o balanço compreende ativo, passivo e patrimônio líquido","Lei 6.404/1976 art. 176, I — o balanço patrimonial é demonstração obrigatória","CPC 26 (R1) / NBC TG 26 — apresentação das demonstrações contábeis (equação patrimonial)"]],["EST-02","Resultado da DRE = Lucro/Prejuízo do exercício no DMPL","Resultado líquido do exercício (soma dos analíticos da DRE, sem número de ações e lucro por ação; despesas gravadas negativas) comparado com Lucro Líquido + Prejuízo Líquido na DMPL, na mesma coluna. O resultado que a empresa apurou tem de ser o mesmo que ela leva ao patrimônio líquido.","Se a empresa apresenta o lucro do DMPL antes de participações ou de outra parcela que a DRE já deduziu, a diferença tem explicação; conferir a nota explicativa. DRE e DMPL zerados = sem dados.",["Lei 6.404/1976 art. 187 — a DRE discrimina o resultado líquido do exercício","Lei 6.404/1976 art. 186 — a DLPA/mutações parte do lucro líquido do exercício","CPC 26 (R1) itens 106 e 109 — DMPL concilia o resultado do período com o patrimônio líquido"]],["EST-03","Saldo final do DMPL = Patrimônio Líquido do BP","Soma os analíticos da DMPL (saldo inicial, ajustes, resultado e destinações, estas gravadas com sinal) e compara com a soma dos itens 23x do BP, na mesma coluna. DMPL em branco com PL no BP é alerta: a demonstração não foi entregue.","Ajuste de exercícios anteriores ou reserva digitada só em um dos demonstrativos explica a diferença; ela só se resolve conferindo item a item (aba Demonstrativos).",["Lei 6.404/1976 art. 176, II e III — DLPA (ou DMPL) é demonstração obrigatória","CPC 26 (R1) item 106 — a DMPL reconcilia o saldo inicial e o final de cada componente do PL","Lei 6.404/1976 art. 178, §2º, III — composição do patrimônio líquido no balanço"]],["EST-04","Coluna anterior = coluna atual do exercício passado","Ativo, passivo+PL, resultado e saldo final do DMPL gravados na coluna ANT deste exercício devem repetir os da coluna ATU do exercício anterior (MIL do ano anterior). Diferença indica reapresentação ou digitação divergente.","Reapresentação por mudança de política, estimativa ou correção de erro é permitida, mas exige divulgação em nota explicativa. Sem nota, é divergência a explicar.",["CPC 23 / NBC TG 23 — correção de erro e mudança de política: reapresentação retrospectiva","CPC 26 (R1) itens 38 a 44 — informação comparativa do período anterior","Lei 6.404/1976 art. 176, §1º — as demonstrações do exercício são publicadas com as do exercício anterior"]],["EST-05","Demonstrativos entregues","Verifica se BP, DRE e DMPL têm algum valor na coluna atual. Empresa sem nada é tratada como 'sem dados' nas outras regras, para não inflar os alertas.","Empresa em implantação ou sem movimento pode legitimamente entregar demonstrativo zerado; ainda assim deve estar justificado.",["Lei 6.404/1976 art. 176 — balanço patrimonial, DLPA, DRE e DFC ao fim de cada exercício","Lei 13.303/2016 — estatutos e transparência das empresas estatais (regime de divulgação de informações e demonstrações)"]],["EST-06","Demonstrativo fechado no INTEGRA","Verifica se existe registro em BALANCOESTATALFECHAMENTO para o demonstrativo. O fechamento é o ato em que a empresa dá o número por entregue; sem ele o valor ainda pode mudar e não deveria ser tratado como definitivo.","No meio do exercício é esperado que o demonstrativo do ano corrente esteja aberto. A regra pesa mais perto do fechamento do Balanço Geral.",["Lei 6.404/1976 art. 176, §5º — notas explicativas integram as demonstrações","Norma interna do INTEGRA/SEEC-DF sobre prazo de fechamento (confirmar com a área)"]],["EST-07","Item fora da equação ou sintético preenchido","Procura valor gravado em item que não existe na equação (EQUACAOBALANCOESTATAL) ou em item sintético, que deveria ser só a soma dos filhos. Valor nesses itens fica fora dos totais ou conta em duplicidade.","Não há situação legítima: o item sintético é calculado.",["CPC 26 (R1) — estrutura e conteúdo mínimo das demonstrações (itens e subtotais)","Estrutura da equação do balanço das estatais (INTEGRA), MIL{ano}.EQUACAOBALANCOESTATAL"]],["EST-08","Variação do Ativo acima de ±50%","Compara o ativo total da coluna atual com a anterior. Não é erro por si: é o sinal de que algo grande mudou e merece explicação.","Aquisição, incorporação, reavaliação, baixa relevante ou ano parcial explicam a variação; deve constar em nota explicativa.",["CPC 26 (R1) item 112 — notas explicativas devem divulgar informação relevante não apresentada nas demonstrações","Lei 6.404/1976 art. 176, §5º — notas explicativas esclarecem a situação patrimonial"]]],"res":{"EST-01":[{"ug":130201,"st":"OK","ctx":"BP ANT 31/12/2025","esp":9521.36,"en const nf=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const f=v=>v==null?'—':nf.format(v);
const nomeUG=Object.fromEntries(D.ugs.map(x=>[x[0],x[1]]));
const lab=u=>u+' · '+(nomeUG[u]||'');
let ab='reg',fSt='ALERTA',fUG='',fReg='',ugSel=D.ugs[0][0],balSel=1;
function cont(arr){const c={OK:0,ALERTA:0,ND:0};arr.forEach(x=>c[x.st]++);return c}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function aba(a){ab=a;['reg','mx','emp'].forEach(k=>document.getElementById('t-'+k).classList.toggle('on',k===a));draw()}
function pior(arr){return arr.some(x=>x.st==='ALERTA')?'ALERTA':arr.some(x=>x.st==='OK')?'OK':'ND'}
function kpis(){
  let t={OK:0,ALERTA:0,ND:0};
  D.regras.forEach(r=>{const c=cont(D.res[r[0]]);for(const k in t)t[k]+=c[k]});
  document.getElementById('kpis').innerHTML=
   `<div class="kpi"><b>${D.ugs.length}</b><span>empresas</span></div>
    <div class="kpi k-ok"><b>${t.OK}</b><span>conferências OK</span></div>
    <div class="kpi k-al"><b>${t.ALERTA}</b><span>em alerta</span></div>
    <div class="kpi k-nd"><b>${t.ND}</b><span>sem dados</span></div>`;
  document.getElementById('sub').textContent=`MIL${D.ano} · gerado em ${D.gerado_em} · totais calculados pela soma dos itens analíticos (o INTEGRA não grava os sintéticos) · citações de normas federais de memória do texto legal: conferir o artigo antes de usar em parecer`;
}
function filtros(){
  const chips=['','ALERTA','OK','ND'].map(s=>`<span class="chip ${fSt===s?'on':''}" onclick="fSt='${s}';draw()">${s||'Todos'}</span>`).join('');
  const opts=['<option value="">Todas as empresas</option>'].concat(D.ugs.map(u=>`<option value="${u[0]}" ${fUG==u[0]?'selected':''}>${esc(lab(u[0]))}</option>`)).join('');
  return `<div class="bar"><div class="f"><label>Situação</label><div style="display:flex;gap:4px">${chips}</div></div>
   <div class="f"><label>Empresa</label><select onchange="fUG=this.value;draw()">${opts}</select></div></div>`;
}
function regras(){
  let h=filtros();
  D.regras.forEach(r=>{
    let L=D.res[r[0]];const c=cont(L);
    if(fUG)L=L.filter(x=>x.ug==fUG);
    const vis=L.filter(x=>!fSt||x.st===fSt);
    if(fSt&&!vis.length)return;
    const st=c.ALERTA?'ALERTA':c.OK?'OK':'ND';
    const lin=vis.map(x=>`<tr><td>${esc(lab(x.ug))}</td><td>${esc(x.ctx)}</td>
      <td class="n">${f(x.esp)}</td><td class="n">${f(x.enc)}</td>
      <td class="n ${x.st==='ALERTA'&&x.dif!=null?'dif':''}">${x.dif==null?'':f(x.dif)}</td>
      <td class="mut">${esc(x.nota)}</td><td><span class="badge b-${x.st}">${x.st}</span></td></tr>`).join('');
    h+=`<details class="card" ${fSt==='ALERTA'&&c.ALERTA?'open':''}><summary><span class="cod">${r[0]}</span><span class="ttl">${esc(r[1])}</span>
      <span class="badge b-ALERTA">${c.ALERTA} alerta</span><span class="badge b-OK">${c.OK} ok</span><span class="badge b-ND">${c.ND} sem dados</span></summary>
      <div class="cb"><h3 style="margin-top:4px">Como a regra funciona</h3><div class="desc">${esc(r[2])}</div>
      <h3>Quando pode não ser erro</h3><div class="desc">${esc(r[3])}</div>
      <h3>Normas relacionadas</h3><ul class="nm">${r[4].map(n=>`<li>${esc(n.replace('{ano}',D.ano))}</li>`).join('')}</ul>
      <h3>Resultado por empresa</h3><table><tr><th>Empresa</th><th>Referência</th><th class="n">Esperado</th><th class="n">Encontrado</th><th class="n">Diferença</th><th>Observação</th><th></th></tr>${lin}</table></div></details>`;
  });
  return h||'<div class="ph">Nada com esse filtro.</div>';
}
function matriz(){
  let h='<div class="desc" style="color:var(--mut);margin-bottom:10px">Pior situação de cada regra por empresa. Clique na célula para abrir a regra.</div><table class="mx"><tr><th>Empresa</th>'+D.regras.map(r=>`<th>${r[0]}</th>`).join('')+'<th>Situação da carga</th><th>Última digitação</th></tr>';
  D.ugs.forEach(u=>{
    h+=`<tr><td>${esc(lab(u[0]))}</td>`+D.regras.map(r=>{
      const L=D.res[r[0]].filter(x=>x.ug==u[0]);const s=pior(L);const n=L.filter(x=>x.st==='ALERTA').length;
      return `<td><span class="dot b-${s}" style="cursor:pointer" onclick="fUG=${u[0]};fSt='';aba('reg')">${s==='OK'?'✓':s==='ND'?'–':n}</span></td>`}).join('')+`<td style="text-align:left"><span class="badge ${SIT[D.sit[u[0]]][0]}">${D.sit[u[0]]}</span> <span class="mut" style="font-size:11px">${esc(SIT[D.sit[u[0]]][1])}</span></td><td>${D.ultalt[u[0]]||'—'}</td></tr>`;
  });
  return h+'</table><div class="desc" style="margin-top:10px">✓ confere · número = quantidade de alertas · – sem dados</div>';
}
function demonst(){
  const ops=D.ugs.map(u=>`<option value="${u[0]}" ${u[0]==ugSel?'selected':''}>${esc(lab(u[0]))}</option>`).join('');
  const bs=[[1,'Balanço Patrimonial'],[2,'DRE'],[3,'DMPL']].map(b=>`<span class="chip ${balSel==b[0]?'on':''}" onclick="balSel=${b[0]};draw()">${b[1]}</span>`).join('');
  const vals=Object.fromEntries((D.ver[ugSel][balSel]||[]).map(x=>[x[0],[x[1],x[2]]]));
  const lin=D.eq[balSel].filter(e=>vals[e[0]]).map(e=>{
    const v=vals[e[0]];
    return `<tr class="${e[2]?'':'sint'}"><td class="mut">${e[0]}</td><td style="padding-left:${8+e[3]*14}px">${esc(e[1])}</td><td class="n">${f(v[0])}</td><td class="n">${f(v[1])}</td></tr>`}).join('');
  return `<div class="bar"><div class="f"><label>Empresa</label><select onchange="ugSel=+this.value;draw()">${ops}</select></div>
   <div class="f"><label>Demonstrativo</label><div style="display:flex;gap:4px">${bs}</div></div></div>
   ${lin?`<table><tr><th>Item</th><th>Descrição</th><th class="n">${D.col[0]}</th><th class="n">${D.col[1]}</th></tr>${lin}</table>
   <div class="desc" style="margin-top:8px">Linhas em destaque são totais calculados; as demais são digitadas pela empresa.</div>`:'<div class="ph">Nada preenchido neste demonstrativo.</div>'}`;
}
const SIT={copia:['b-ND','cópia do MIL'+(D.ano-1)+': as duas colunas repetem as de '+(D.ano-1)+' (exercício corrente ainda não digitado)'],
 rolado:['b-OK','avançada: ANT = ATU de '+(D.ano-1)+'; ATU é o exercício corrente'],
 outro:['b-ALERTA','ANT difere do ATU de '+(D.ano-1)+' em algum item, e não é cópia do MIL'+(D.ano-1)+' (ver EST-04)'],
 vazio:['b-ND','nada preenchido'],indisponivel:['b-ND','MIL'+(D.ano-1)+' indisponível para comparar']};
function legenda(){
  return `<details class="card" style="margin-bottom:12px"><summary><span class="cod">Períodos</span><span class="ttl">ANT = ${D.col[0].slice(4)} · ATU = ${D.col[1].slice(4)} — clique para entender</span></summary>
  <div class="cb"><div class="desc">O INTEGRA grava dois valores por item, <b>VABALANCOANT</b> (exercício anterior) e <b>VABALANCOATU</b> (exercício atual), e <b>não guarda a data do período</b>. As datas deste painel seguem a convenção do Anexo II: no MIL${D.ano}, ANT = 31/12/${D.ano-1} e ATU = 31/12/${D.ano}.
  Como o exercício ${D.ano} ainda não fechou, a coluna ATU só tem dado real quando a empresa já digitou o ano corrente. Para saber o que realmente há dentro de cada coluna, o painel compara o MIL${D.ano} com o MIL${D.ano-1} (ver "Situação da carga" na aba Empresa × regra). A "última digitação" é a data do último registro gravado em BALANCOESTATAL.</div></div></details>`}
function draw(){kpis();document.getElementById('main').innerHTML=legenda()+(ab==='reg'?regras():ab==='mx'?matriz():demonst())}
draw();
</script>
