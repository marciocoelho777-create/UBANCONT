<script>
(function(){
  var H="2bea89a49ae0f463aa32710bb5d4d3d2118613e0b822d7fcc6d09ca5c9e402b2",K="gate_"+H.slice(0,8);
  var g=document.getElementById('_gate');
  if(!g) return;
  if(sessionStorage.getItem(K)===H){return;}
  g.style.display='flex';
  document.body.style.overflow='hidden';
  var inp=document.getElementById('_gpw');
  var btn=document.getElementById('_gbtn');
  var err=document.getElementById('_gerr');
  function ok(){g.style.display='none';document.body.style.overflow='';}
  async function check(){
    var enc=new TextEncoder().encode(inp.value);
    var buf=await crypto.subtle.digest('SHA-256',enc);
    var hex=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    if(hex===H){sessionStorage.setItem(K,H);ok();}
    else{err.textContent='Senha incorreta.';inp.value='';inp.focus();}
  }
  btn.addEventListener('click',check);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  inp.focus();
})();
</script>

<script>
const D={"ano":2025,"arquivo":"Doc. UCAI.xls","gerado_em":"15/10/2026 17:00","mod":"24/03/2026 18:26","regras":[["U-01","Cadastro das UGs (aba 11.1) × Oracle","Cada UG listada na 11.1 existe no cadastro de unidades gestoras do Oracle, e a que consta como sistema INTEGRA tem balanço gravado em BALANCOESTATAL. Também aponta UG do INTEGRA que não está na 11.1.","Subsidiária consolidada na controladora pode não ter balanço próprio no INTEGRA; vale confirmar com a UCAI. Empresa em liquidação aparece na 11.1 sem número de UG.",["Lei 4.320/1964 art. 101 — o Balanço Geral demonstra a situação patrimonial do ente, incluindo a administração indireta","LC 101/2000 art. 51 — consolidação das contas, com a administração indireta"]],["U-02","Coerência entre as abas (UG e nome)","UG que aparece na 11.7 (execução orçamentária) ou no capital social (11.4) tem de constar na 11.1, com o mesmo nome; empresa da 11.1 sem execução na 11.7 é avisada.","Empresa nova do exercício pode ter entrado na 11.7 antes de ser incluída na 11.1; subsidiária sem orçamento próprio não aparece na 11.7.",["CF/88 art. 165, §5º, II — orçamento de investimento das empresas em que o ente detenha a maioria do capital votante","Lei 4.320/1964 art. 101"]],["U-03","BP fecha: Ativo = Passivo + PL (11.2 e 11.3)","Total do ativo contra total do passivo mais patrimônio líquido, nas quatro abas de BP (resumido e analítico, OFSS com empresas e empresas públicas).","Só tolerância de arredondamento (R$ 1,00).",["Lei 4.320/1964 art. 105 e Anexo 14 — Balanço Patrimonial (ativo, passivo e patrimônio líquido)","MCASP 11ª ed., Parte V — Balanço Patrimonial e demonstrações consolidadas","NBC TSP Estrutura Conceitual / NBC TSP 11 — Apresentação das Demonstrações Contábeis"]],["U-04","Subtotais do BP somam seus componentes","Ativo circulante, ativo não circulante, passivo circulante, passivo não circulante, patrimônio líquido e resultado acumulado conferidos contra a soma das linhas de cada grupo; total do ativo = circulante + não circulante.","Não há situação legítima: a planilha deveria ser fórmula. Linha digitada à mão que não soma indica edição manual.",["Lei 4.320/1964 art. 105 — grupos do balanço patrimonial","MCASP 11ª ed., Parte V — estrutura do BP"]],["U-05","Resumido = analítico (11.2.1×11.2.2 e 11.3.1×11.3.2)","Cada linha do BP resumido contra a mesma linha do analítico. A planilha tem as duas versões do mesmo balanço; elas têm de dizer o mesmo.","Diferença de arredondamento até R$ 1,00. Acima disso, uma das abas foi editada sem refletir na outra.",["MCASP 11ª ed., Parte V — consistência entre demonstrações e notas","Lei 4.320/1964 art. 105"]],["U-06","11.3 (empresas públicas) cabe dentro da 11.2 (OFSS com empresas)","Ativo, passivo e PL das empresas públicas não podem superar o total do OFSS com empresas do qual fazem parte (em valor absoluto, exceto PL negativo).","O PL do consolidado pode ser menor que o das empresas se o resto do OFSS tem PL negativo (é o caso do DF, com PL consolidado negativo); por isso a regra confere só ativo e passivo.",["MCASP 11ª ed., Parte V — consolidação das demonstrações contábeis","LC 101/2000 art. 51"]],["U-07","Execução orçamentária das estatais (11.7)","Total de cada coluna = soma das linhas, e Executado ≤ Dotação Autorizada em cada UG (dispêndio e investimento).","Executado acima da dotação só se houve crédito adicional não refletido na coluna de dotação autorizada.",["CF/88 art. 165, §5º, II — orçamento de investimento das estatais","Lei 4.320/1964 arts. 59 e 167 (CF) — despesa não pode exceder o crédito"]],["U-08","Capital social (11.4.1): somas e participação","Total de ações e cotas = ON + PN + PNA + PNB + cotas; total do capital social = soma das linhas; % GDF entre 0 e 100%; quantidade de ações inteira.","Ações fracionadas aparecem quando a quantidade foi convertida de outra base (ex.: lote, cotas) e merecem conferência.",["Lei 6.404/1976 arts. 5º e 11 — capital social fixado no estatuto e valor nominal das ações","NBC TSP 18 — investimentos em coligadas e controladas"]],["U-09","Capital social (11.4.1) × INTEGRA","Valor do capital social da planilha contra o item Patrimônio Social e Capital Social (231x) do balanço digitado no INTEGRA, coluna atual. Empresa sem UG ou sem balanço no INTEGRA fica 'sem dados'.","O 11.4.1 mostra o capital da empresa; se ele for só a parte do GDF, a diferença é a parte dos demais acionistas. Valor do INTEGRA em milhares (erro de unidade) aparece como divergência de fator 1.000.",["Lei 6.404/1976 arts. 5º e 11","Lei 4.320/1964 art. 105 — o capital integra o patrimônio líquido do balanço"]],["U-10","Participações majoritárias (11.4.2) e minoritárias (11.4.3)","Total = soma das linhas; total de ações coerente com as colunas; valor do MEP (equivalência patrimonial) não pode superar o patrimônio líquido da investida no INTEGRA e deve ficar perto de % GDF × PL (±5%).","Empresa com PL negativo ou participação indireta (via fundo ou outra empresa) pode fugir do % GDF; CODHAB, por exemplo, mostra o PL cheio como MEP.",["Lei 6.404/1976 art. 248 — método da equivalência patrimonial","NBC TSP 18 — investimentos em coligadas e em empreendimentos controlados em conjunto (MEP)","MCASP 11ª ed., Parte II — participações societárias"]]],"res":{"U-01":[{"aba":"11.1 Órgãos Adm Indireta","st":"OK","ctx":"140202 INAS","esp":null,"enc":null,"dif":null,"nota":"cadastro ok (CONTÁBIL)"},{"aba":"11.1 Órgãos Adm Indireta","st":"OK","ctx":"150205 SLU","esp":null,"enc":null,"dif":null,"nota":"cadastro ok (CONTÁBIL)"},{"aba":"11.1 Órgãos Adm Indireta","st":"OK","ctx":"150206 ADASA","esp":null,"enc":null,"dif":null,"nota":"cadastro ok (CONTÁBIL)"},{"aba":"11.1 Órgãos Adm Indireta","st":"OK","ctx":"180203 UnDF","esp":null,"enc":null,"dif":null,"nota":"cadastro ok (CONTÁBIL)"},{"aba":"11.1 Órgãos Adm Indireta","st":"OK","ctx":"190219 IPEDF","esp":null,"enc":null,"dif":null,"nota":"cadastro ok (CONTÁBIL)"},{"aba":"11.1 Órgãos Adm Indireta","st":"OK","ctx":"200202 DER","esp":null,"enc":null,"dif":null,"n const nf=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
const f=v=>v==null?'—':nf.format(v);
let ab='reg',fSt='ALERTA',fAba='',abaSel=D.abas[0].nome;
function cont(arr){const c={OK:0,ALERTA:0,ND:0};arr.forEach(x=>c[x.st]++);return c}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function aba(a){ab=a;['reg','abas'].forEach(k=>document.getElementById('t-'+k).classList.toggle('on',k===a));draw()}
function kpis(){
  let t={OK:0,ALERTA:0,ND:0};
  D.regras.forEach(r=>{const c=cont(D.res[r[0]]);for(const k in t)t[k]+=c[k]});
  document.getElementById('kpis').innerHTML=
   `<div class="kpi"><b>${D.abas.length}</b><span>abas lidas</span></div>
    <div class="kpi k-ok"><b>${t.OK}</b><span>conferências OK</span></div>
    <div class="kpi k-al"><b>${t.ALERTA}</b><span>em alerta</span></div>
    <div class="kpi k-nd"><b>${t.ND}</b><span>sem dados</span></div>`;
  document.getElementById('sub').textContent=`${D.arquivo} (salvo em ${D.mod}) · comparações com o INTEGRA do MIL${D.ano} · gerado em ${D.gerado_em} · citações de normas federais de memória do texto legal: conferir o artigo antes de usar em parecer`;
}
function filtros(){
  const chips=['','ALERTA','OK','ND'].map(s=>`<span class="chip ${fSt===s?'on':''}" onclick="fSt='${s}';draw()">${s||'Todos'}</span>`).join('');
  const abas=[...new Set(Object.values(D.res).flat().map(x=>x.aba))];
  const opts=['<option value="">Todas as abas</option>'].concat(abas.map(a=>`<option value="${esc(a)}" ${fAba===a?'selected':''}>${esc(a)}</option>`)).join('');
  return `<div class="bar"><div class="f"><label>Situação</label><div style="display:flex;gap:4px">${chips}</div></div>
   <div class="f"><label>Aba</label><select onchange="fAba=this.value;draw()">${opts}</select></div></div>`;
}
function regras(){
  let h=filtros();
  D.regras.forEach(r=>{
    let L=D.res[r[0]];const c=cont(L);
    if(fAba)L=L.filter(x=>x.aba===fAba);
    const vis=L.filter(x=>!fSt||x.st===fSt);
    if(fSt&&!vis.length)return;
    const lin=vis.map(x=>`<tr><td>${esc(x.aba)}</td><td>${esc(x.ctx)}</td>
      <td class="n">${f(x.esp)}</td><td class="n">${f(x.enc)}</td>
      <td class="n ${x.st==='ALERTA'&&x.dif!=null?'dif':''}">${x.dif==null?'':f(x.dif)}</td>
      <td class="mut">${esc(x.nota)}</td><td><span class="badge b-${x.st}">${x.st}</span></td></tr>`).join('');
    h+=`<details class="card" ${fSt==='ALERTA'&&c.ALERTA?'open':''}><summary><span class="cod">${r[0]}</span><span class="ttl">${esc(r[1])}</span>
      <span class="badge b-ALERTA">${c.ALERTA} alerta</span><span class="badge b-OK">${c.OK} ok</span><span class="badge b-ND">${c.ND} sem dados</span></summary>
      <div class="cb"><h3 style="margin-top:4px">Como a regra funciona</h3><div class="desc">${esc(r[2])}</div>
      <h3>Quando pode não ser erro</h3><div class="desc">${esc(r[3])}</div>
      <h3>Normas relacionadas</h3><ul class="nm">${r[4].map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
      <h3>Resultado</h3><table><tr><th>Aba</th><th>Referência</th><th class="n">Esperado</th><th class="n">Encontrado</th><th class="n">Diferença</th><th>Observação</th><th></th></tr>${lin}</table></div></details>`;
  });
  return h||'<div class="ph">Nada com esse filtro.</div>';
}
function mostraAba(){
  const ops=D.abas.map(a=>{const n=Object.keys(D.flags).filter(k=>k.startsWith(a.nome+'|')).length;return `<option value="${esc(a.nome)}" ${a.nome===abaSel?'selected':''}>${esc(a.nome)}${n?' ('+n+' linha(s) em alerta)':''}</option>`}).join('');
  const A=D.abas.find(a=>a.nome===abaSel);
  const lin=A.linhas.map(L=>{
    const fl=D.flags[A.nome+'|'+L[0]];
    const cru=A.nome.startsWith('11.1');
    const cel=L.slice(1).map(v=>typeof v==='number'?(cru?`<td>${v}</td>`:`<td class="n">${Math.abs(v)<=1.0001&&v!==0&&v%1!==0?v.toFixed(4):f(v)}</td>`):`<td>${esc(v)}</td>`).join('');
    return `<tr class="${fl?'flag':''}"><td class="mut">${L[0]+1}</td>${cel}</tr>`+(fl?`<tr class="flag"><td></td><td colspan="9" class="fm">${fl.map(esc).join('<br>')}</td></tr>`:'');
  }).join('');
  return `<div class="bar"><div class="f"><label>Aba</label><select onchange="abaSel=this.value;draw()">${ops}</select></div></div>
   <table><tr><th>Linha</th><th colspan="9">Conteúdo da planilha (linhas em vermelho têm alerta)</th></tr>${lin}</table>`;
}
function draw(){kpis();document.getElementById('main').innerHTML=ab==='reg'?regras():mostraAba()}
draw();
</script>
