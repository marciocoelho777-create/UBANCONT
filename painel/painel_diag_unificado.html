<script>
(function(){
  var H="2bea89a49ae0f463aa32710bb5d4d3d2118613e0b822d7fcc6d09ca5c9e402b2",K="gate_"+H.slice(0,8);
  var g=document.getElementById('_gate');
  if(!g) return;
  if(sessionStorage.getItem(K)===H){return;}
  g.style.display='flex';
  document.body.style.overflow='hidden';
  var inp=document.getElementById('_gpw');
  var btn=document.getElementById('_gbtn');
  var err=document.getElementById('_gerr');
  function ok(){g.style.display='none';document.body.style.overflow='';}
  async function check(){
    var enc=new TextEncoder().encode(inp.value);
    var buf=await crypto.subtle.digest('SHA-256',enc);
    var hex=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    if(hex===H){sessionStorage.setItem(K,H);ok();}
    else{err.textContent='Senha incorreta.';inp.value='';inp.focus();}
  }
  btn.addEventListener('click',check);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  inp.focus();
})();
</script>

      });
    }
  }
  pinta();
}

function pior(res){
  let s = 'OK';
  for (const [cod,r] of Object.entries(res)){
    if (ESCOPO[cod] && ESCOPO[cod].escopo === 'consolidado') continue;
    if (r.s === 'ERRO') return 'ERRO';
    if (r.s === 'ALERTA') s = 'ALERTA';
  }
  return s;
}

function fmt(v){
  if (v === null || v === undefined) return '';
  return v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}

function pinta(){
  const sel = document.getElementById('alvo');
  let res, rotulo;
  if (NIVEL === 'cons'){ res = P.consolidado; rotulo = 'GDF consolidado'; }
  else if (NIVEL === 'tipo'){
    const t = P.tipos[sel.value|0]; res = t.res;
    rotulo = 'Tipo ' + t.cotipo + ' — ' + t.nome;
  } else {
    const u = P.ugs[sel.value|0]; res = u.res;
    rotulo = 'UG ' + u.ug + ' — ' + u.nome;
  }

  // KPIs
  const kp = document.getElementById('kpis');
  if (NIVEL === 'cons'){
    let comErro = 0, comAlerta = 0, limpas = 0;
    P.ugs.forEach(u => { const s = pior(u.res);
      if (s==='ERRO') comErro++; else if (s==='ALERTA') comAlerta++; else limpas++; });
    kp.innerHTML =
      card_kpi('e', comErro,  'Unidades com erro', 'ERRO') +
      card_kpi('a', comAlerta,'Unidades com alerta', 'ALERTA') +
      card_kpi('o', limpas,   'Unidades sem apontamento', 'OK') +
      card_kpi('i', P.ugs.length, 'Unidades avaliadas', 'ALL');
  } else {
    const c = {ERRO:0, ALERTA:0, OK:0, INFO:0};
    Object.entries(res).forEach(([cod,r]) => {
      if (ESCOPO[cod] && ESCOPO[cod].escopo === 'consolidado') return;
      c[r.s] = (c[r.s]||0)+1;
    });
    kp.innerHTML =
      card_kpi('e', c.ERRO,   'Controles com erro', 'ERRO') +
      card_kpi('a', c.ALERTA, 'Controles em alerta', 'ALERTA') +
      card_kpi('o', c.OK,     'Controles OK', 'OK') +
      card_kpi('i', c.INFO,   'Informativos', 'INFO');
  }
  kp.classList.toggle('filtrando', !!FILTRO);

  // cards de controle
  const cont = document.getElementById('conteudo');
  let h = '<h2>' + esc(rotulo) + '</h2>';
  if (FILTRO) h += '<div class="fx">Mostrando só ' + NOMEF[FILTRO] +
    '<button type="button" onclick="setFiltro(null)">× limpar filtro</button></div>';
  P.controles.forEach(c => {
    const r = res[c.codigo]; if (!r) return;
    if (NIVEL !== 'cons' && FILTRO && r.s !== FILTRO) return;
    const fora = (c.escopo === 'consolidado' && NIVEL !== 'cons');
    h += '<div class="card ' + r.s + (fora ? ' fora' : '') + '">' +
         '<div class="c-top"><span class="chip ' + r.s + '">' + r.s + '</span>' +
         '<span class="cod">' + c.codigo + '</span>' +
         '<span class="tit">' + esc(c.titulo) + '</span>' +
         (c.escopo === 'consolidado'
            ? '<span class="tag' + (c.confirmado ? '' : ' sug') + '">só consolidado' +
              (c.confirmado ? '' : ' (sugerido)') + '</span>' : '') +
         '</div>' +
         (r.d ? '<div class="det">' + esc(r.d) + '</div>' : '') +
         (NORMA[c.codigo] ? '<div class="norma">' + esc(NORMA[c.codigo]) + '</div>' : '') +
         (fora ? '<div class="det">Não conta como problema desta ' +
                 (NIVEL === 'ug' ? 'unidade' : 'fatia') +
                 ': a grandeza só fecha no consolidado.</div>' : '') +
         '</div>';
  });
  cont.innerHTML = h;

  pintaEvo();

  // lista de unidades com apontamento (só no consolidado)
  const hl = document.getElementById('h-lista');
  const lista = document.getElementById('lista');
  if (NIVEL === 'cons'){
    hl.hidden = false;
    hl.textContent = FILTRO === 'OK' ? 'Unidades sem apontamento' : 'Unidades com apontamento';
    const linhas = P.ugs.map((u,i) => ({u, i, s: pior(u.res)}))
                        .filter(x => FILTRO === 'OK' ? x.s === 'OK' : (x.s !== 'OK' && (!FILTRO || x.s === FILTRO)))
                        .sort((a,b) => (a.s === b.s ? 0 : a.s === 'ERRO' ? -1 : 1));
    const ROT = {erro:'Erro', esperada:'Diferença esperada', verificar:'A verificar'};
    let t = '<table class="tbl"><thead><tr><th>Situação</th><th>UG</th><th>Nome</th>' +
            '<th>Controle</th><th>Equação com os valores</th><th>Norma / legislação</th>' +
            '<th>Classificação</th></tr></thead><tbody>';
    if (FILTRO === 'OK'){
      t = '<table class="tbl"><thead><tr><th>UG</th><th>Nome</th></tr></thead><tbody>' +
          linhas.map(x => '<tr class="cli" onclick="irUG(' + x.i + ')"><td class="n">' + x.u.ug +
                          '</td><td>' + esc(x.u.nome) + '</td></tr>').join('');
    } else linhas.forEach(x => {
      const maus = Object.entries(x.u.res).filter(([cod,r]) =>
          (r.s==='ERRO'||r.s==='ALERTA') &&
          !(ESCOPO[cod] && ESCOPO[cod].escopo === 'consolidado'));
      maus.forEach(([cod, r], k) => {
        const n = P.normas[cod] || {};
        const cl = (x.u.cls || {})[cod] || {c:'erro', m:''};
        t += '<tr class="cli" onclick="irUG(' + x.i + ')">' +
             '<td><span class="chip ' + r.s + '">' + r.s + '</span></td>' +
             '<td class="n">' + (k ? '' : x.u.ug) + '</td>' +
             '<td>' + (k ? '' : esc(x.u.nome)) + '</td>' +
             '<td class="cod">' + cod + '</td>' +
             '<td class="eq"><b>' + esc(n.equacao || (ESCOPO[cod] ? ESCOPO[cod].titulo : '')) +
               '</b><br>' + esc(r.d || '') + '</td>' +
             '<td class="nm">' + (n.normas || []).map(esc).join('<br>') + '</td>' +
             '<td class="cl ' + cl.c + '"><b>' + ROT[cl.c] + '</b><br>' + esc(cl.m) +
             (cl.orig ? '<br><b>Crédito veio de:</b><br>' + cl.orig.map(o =>
                 esc(o.ug + ' ' + (o.nome || '(sem nome)') + ' — ' + o.tipo + ' ' +
                     fmt(o.v) + ' (' + o.n + ' lanç.)')).join('<br>') : '') + '</td></tr>';
      });
    });
    lista.innerHTML = t + '</tbody></table>';
  } else { hl.hidden = true; lista.innerHTML = ''; }
}


// ── histórico / evolução ────────────────────────────────────────────────────
let EVO_REF = null;   // índice em P.historico do snapshot de comparação
function evoMud(a,b){ return a.s!==b.s || Math.abs((a.v||0)-(b.v||0))>0.009; }
function setRef(i){ EVO_REF = i; pintaEvo(); }
function pintaEvo(){
  const box = document.getElementById('evo');
  const H = P.historico || [];
  if (NIVEL !== 'cons' || H.length < 2){ box.innerHTML=''; return; }
  const atual = H.length-1;
  if (EVO_REF === null || EVO_REF >= atual) EVO_REF = atual-1;

  const W=640, Ht=130, m={l:34,r:12,t:12,b:22};
  const max = Math.max(1, ...H.map(h=>h.n_erro));
  const x = i => m.l + i*(W-m.l-m.r)/(H.length-1);
  const y = v => Ht-m.b - v*(Ht-m.t-m.b)/max;
  let svg = '<svg viewBox="0 0 '+W+' '+Ht+'" role="img" aria-label="Unidades com erro ao longo do tempo">';
  [0, Math.round(max/2), max].forEach(g => {
    svg += '<line class="gr" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(g)+'" y2="'+y(g)+'"/>' +
           '<text class="ax" x="'+(m.l-6)+'" y="'+(y(g)+3)+'" text-anchor="end">'+g+'</text>';
  });
  const mesAtual = H[atual].mes + '/' + H[atual].ano;
  svg += '<polyline class="ln" points="' + H.map((h,i)=>x(i)+','+y(h.n_erro)).join(' ') + '"/>';
  H.forEach((h,i) => {
    svg += '<circle class="pt'+(i===EVO_REF?' at':'')+((h.mes+'/'+h.ano)!==mesAtual?' outra':'')+'" r="4" cx="'+x(i)+'" cy="'+y(h.n_erro)+
           '" onclick="setRef('+(i===atual?atual-1:i)+')"><title>'+esc(refMes(h)+' · extraído em '+h.gerado)+' — '+
           h.n_erro+' unidade(s) com erro</title></circle>';
  });
  const passo = Math.max(1, Math.ceil(H.length/8));
  H.forEach((h,i) => { if (i%passo===0 || i===atual)
    svg += '<text class="ax" x="'+x(i)+'" y="'+(Ht-6)+'" text-anchor="'+(i===atual?'end':(i===0?'start':'middle'))+'">'+esc(h.gerado.slice(0,5)+' '+h.gerado.slice(11))+'</text>'; });
  svg += '</svg>';

  const ref = H[EVO_REF].ugs, now = H[atual].ugs;
  const linhas = [];
  Object.keys(now).forEach(ug => Object.entries(now[ug].res).forEach(([c,r]) => {
    const o = ref[ug] && ref[ug].res[c];
    const k = !o ? 'novo' : (evoMud(o,r) ? 'mud' : 'per');
    linhas.push({k:k, ug:+ug, nome:now[ug].nome, c:c, a:o||null, b:r});
  }));
  Object.keys(ref).forEach(ug => Object.entries(ref[ug].res).forEach(([c,o]) => {
    if (!(now[ug] && now[ug].res[c])) linhas.push({k:'res', ug:+ug, nome:ref[ug].nome, c:c, a:o, b:null});
  }));
  const ordem = {novo:0, mud:1, res:2, per:3};
  linhas.sort((p,q) => ordem[p.k]-ordem[q.k] || p.ug-q.ug);
  const cont = {novo:0, mud:0, res:0, per:0};
  linhas.forEach(l => cont[l.k]++);
  const ROT = {novo:'Novo', mud:'Valor mudou', res:'Resolvido', per:'Persiste'};
  const cel = r => r ? '<span class="chip '+r.s+'">'+r.s+'</span> '+fmt(r.v) : '—';

  let h = '<div class="evo"><span class="lbl">Evolução dos apontamentos (unidades com erro)</span>' +
    (H.some(q => (q.mes+'/'+q.ano)!==mesAtual)
      ? '<span style="font-size:11.5px;color:var(--t3);margin-left:10px">pontos amarelos = outra competência</span>' : '') + svg +
    '<div class="sel-linha"><div><span class="lbl">Comparar a situação atual com</span>' +
    '<select onchange="setRef(+this.value)">' +
    H.slice(0,atual).map((q,i) => '<option value="'+i+'"'+(i===EVO_REF?' selected':'')+'>'+
       esc(refMes(q)+' · extraído em '+q.gerado)+' — '+q.n_erro+' un. com erro'+
       ((q.mes+'/'+q.ano)!==mesAtual?' (outra competência)':'')+'</option>').join('') +
    '</select></div><div style="font-size:12.5px;color:var(--t2)">' +
    '<b style="color:var(--err)">'+cont.novo+'</b> novos · ' +
    '<b style="color:var(--inf)">'+cont.mud+'</b> mudaram de valor · ' +
    '<b style="color:var(--ok)">'+cont.res+'</b> resolvidos · ' +
    '<b style="color:var(--wrn)">'+cont.per+'</b> persistem</div></div>';
  h += '<table class="tbl" style="margin-top:10px"><thead><tr><th>Mudança</th><th>UG</th><th>Nome</th>' +
       '<th>Controle</th><th>Extraído em '+esc(H[EVO_REF].gerado)+'</th><th>Agora ('+esc(H[atual].gerado)+')</th></tr></thead><tbody>';
  linhas.forEach(l => {
    h += '<tr><td><span class="dif '+l.k+'">'+ROT[l.k]+'</span></td><td class="n">'+l.ug+'</td>' +
         '<td>'+esc(l.nome)+'</td><td class="cod">'+l.c+'</td><td>'+cel(l.a)+'</td><td>'+cel(l.b)+'</td></tr>';
  });
  if (!linhas.length) h += '<tr><td colspan="6">Sem apontamentos em nenhuma das duas datas.</td></tr>';
  box.innerHTML = h + '</tbody></table></div>';
}

function irUG(i){
  setNivel('ug');
  document.getElementById('alvo').value = i;
  pinta();
  window.scrollTo({top:0, behavior:'smooth'});
}

const NOMEF = {ERRO:'erros', ALERTA:'alertas', OK:'itens OK', INFO:'informativos'};
function setFiltro(f){
  FILTRO = (f === 'ALL' || f === FILTRO) ? null : f;
  pinta();
}
function card_kpi(cls, n, lbl, f){
  const on = f && f === FILTRO;
  return '<div class="kpi ' + cls + (on ? ' on' : '') + '" data-f="' + f + '" role="button" tabindex="0"' +
         ' aria-pressed="' + !!on + '" title="Clique para ' + (f === 'ALL' ? 'mostrar tudo' : 'filtrar (de novo para limpar)') +
         '">' +
         '<div class="kpi-n">' + n + '</div><div class="kpi-l">' + lbl + '</div></div>';
}
// cards de resumo clicáveis (delegação: os cards são recriados a cada pinta())
document.getElementById('kpis').addEventListener('click', e => {
  const k = e.target.closest('.kpi[data-f]'); if (k) setFiltro(k.dataset.f);
});
document.getElementById('kpis').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const k = e.target.closest('.kpi[data-f]');
  if (k){ e.preventDefault(); setFiltro(k.dataset.f); }
});
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

setNivel('cons');
</script>
