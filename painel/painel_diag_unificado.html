<style>

}

  --pg:#080C18; --s1:#101827; --s2:#182035; --bd:#1D2C48;
  --t1:#D4DFF5; --t2:#6A7EA6; --t3:#3D5070; --brand:#00b8d4;

  --wrn:#FBBA47; --wrn-bg:#140C00; --wrn-bd:#78350F;

  --inf:#93C5FD; --inf-bg:#0C1A35; --inf-bd:#1E3A5F;
}}
:root[data-theme="dark"]{
  --pg:#080C18; --s1:#101827; --s2:#182035; --bd:#1D2C48;
  --t1:#D4DFF5; --t2:#6A7EA6; --t3:#3D5070; --brand:#00b8d4;
  --err:#F87171; --err-bg:#170404; --err-bd:#7F1D1D;
  --wrn:#FBBA47; --wrn-bg:#140C00; --wrn-bd:#78350F;
  --ok:#4ADE80;  --ok-bg:#031309;  --ok-bd:#14532D;
  --inf:#93C5FD; --inf-bg:#0C1A35; --inf-bd:#1E3A5F;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);font-size:14px;line-height:1.5;color:var(--t1);background:var(--pg)}
.hd{background:var(--navy);color:#fff;padding:14px 24px;display:flex;
    justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
.hd-title{font-size:17px;font-weight:600}
.hd-sub{font-size:12px;opacity:.75}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}

.sel{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);
     padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.sel-linha{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.niveis{display:flex;gap:6px;flex-wrap:wrap}
.nv{border:1px solid var(--bd);background:var(--s2);color:var(--t2);
    padding:7px 16px;border-radius:999px;cursor:pointer;font-size:13px;
    font-weight:600;font-family:var(--fn)}
.nv[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
select{font-family:var(--fn);font-size:13px;padding:7px 10px;border-radius:8px;
       border:1px solid var(--bd);background:var(--s2);color:var(--t1);
       max-width:100%;min-width:260px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);
     font-weight:700;display:block;margin-bottom:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:10px;margin-bottom:16px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);
     padding:12px 14px;box-shadow:var(--shadow)}
.kpi-n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi-l{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;
       font-weight:600;margin-top:2px}
.kpi.e .kpi-n{color:var(--err)} .kpi.a .kpi-n{color:var(--wrn)}
.kpi.o .kpi-n{color:var(--ok)}  .kpi.i .kpi-n{color:var(--inf)}

.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);
      padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow);
      border-left:4px solid var(--bd)}
.card.ERRO{border-left-color:var(--err);background:var(--err-bg)}
.card.ALERTA{border-left-color:var(--wrn);background:var(--wrn-bg)}
.card.OK{border-left-color:var(--ok)}
.card.INFO{border-left-color:var(--inf)}
.card.fora{opacity:.62}
.c-top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;
      border:1px solid;letter-spacing:.03em}
.chip.ERRO{color:var(--err);border-color:var(--err-bd);background:var(--err-bg)}
.chip.ALERTA{color:var(--wrn);border-color:var(--wrn-bd);background:var(--wrn-bg)}
.chip.OK{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}
.chip.INFO{color:var(--inf);border-color:var(--inf-bd);background:var(--inf-bg)}
.cod{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--t2)}
.tit{font-weight:600}
.det{font-size:12.5px;color:var(--t2);font-family:var(--fm);margin-top:3px;
     white-space:pre-wrap;word-break:break-word}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
     background:var(--inf-bg);color:var(--inf);border:1px solid var(--inf-bd)}
.tag.sug{background:var(--wrn-bg);color:var(--wrn);border-color:var(--wrn-bd)}

.aviso{background:var(--inf-bg);border:1px solid var(--inf-bd);border-left:4px solid var(--inf);
       border-radius:var(--r);padding:11px 14px;margin-bottom:14px;font-size:12.5px;color:var(--t1)}
.tbl{width:100%;border-collapse:collapse;background:var(--s1);border:1px solid var(--bd);
     border-radius:var(--r);overflow:hidden;font-size:13px}
.tbl th{background:var(--s2);text-align:left;padding:8px 11px;font-size:11px;
        text-transform:uppercase;letter-spacing:.05em;color:var(--t2)}
.tbl td{padding:7px 11px;border-top:1px solid var(--bd)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--fm)}
.tbl tr.cli{cursor:pointer}
.tbl tr.cli:hover td{background:var(--s2)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);
   margin:20px 0 9px}
footer{font-size:11.5px;color:var(--t3);text-align:center;padding:22px 12px}
@media(max-width:640px){.wrap{padding:14px 16px 40px}.hd{padding:12px 16px}
  select{min-width:100%}.sel-linha{gap:12px}}
.tbl td.eq,.tbl td.nm,.tbl td.cl{font-size:12px;line-height:1.45;max-width:340px;vertical-align:top}
.tbl td.cl.erro b{color:#ff6b6b}.tbl td.cl.esperada b{color:#4cd08a}.tbl td.cl.verificar b{color:#f2c14e}

     padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.evo svg{width:100%;height:auto;display:block;margin:6px 0 10px}
.evo .ln{fill:none;stroke:var(--err);stroke-width:2}
.evo .pt{fill:var(--err);cursor:pointer}.evo .pt.at{fill:var(--brand)}
.evo .ax{fill:var(--t3);font-size:10px;font-family:var(--fn)}
.evo .gr{stroke:var(--bd);stroke-width:1}

.dif.res{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}
.dif.per{color:var(--wrn);border-color:var(--wrn-bd);background:var(--wrn-bg)}
.dif.mud{color:var(--inf);border-color:var(--inf-bd);background:var(--inf-bg)}

</head>

<script>
(function(){
  var H="2bea89a49ae0f463aa32710bb5d4d3d2118613e0b822d7fcc6d09ca5c9e402b2",K="gate_"+H.slice(0,8);
  var g=document.getElementById('_gate');
  if(!g) return;
  if(sessionStorage.getItem(K)===H){return;}
  g.style.display='flex';
  document.body.style.overflow='hidden';
  var inp=document.getElementById('_gpw');
  var btn=document.getElementById('_gbtn');
  var err=document.getElementById('_gerr');
  function ok(){g.style.display='none';document.body.style.overflow='';}
  async function check(){
    var enc=new TextEncoder().encode(inp.value);
    var buf=await crypto.subtle.digest('SHA-256',enc);
    var hex=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    if(hex===H){sessionStorage.setItem(K,H);ok();}
    else{err.textContent='Senha incorreta.';inp.value='';inp.focus();}
  }
  btn.addEventListener('click',check);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  inp.focus();
})();
</script>

let NIVEL = 'cons';

const ESCOPO = {};
P.controles.forEach(c => ESCOPO[c.codigo] = c);

document.getElementById('sub').textContent =
  P.modulos.map(m=>m.sigla).join(' · ') + '  —  ' + P.controles.length +
  ' controles · ' + String(P.mes).padStart(2,'0') + '/' + P.ano;

const nSo = P.controles.filter(c => c.escopo === 'consolidado').length;

  '<b>' + P.modulos.map(m=>m.sigla).join(' · ') + '</b> — ' + P.controles.length +

  ' como problema da unidade. ' : '') +
  'Cada demonstrativo só entra aqui depois de reconciliar ao centavo com o diagnóstico consolidado.';

function setNivel(n){
  NIVEL = n;
  document.getElementById('nv-c').setAttribute('aria-pressed', n==='cons');
  document.getElementById('nv-t').setAttribute('aria-pressed', n==='tipo');
  document.getElementById('nv-u').setAttribute('aria-pressed', n==='ug');
  const box = document.getElementById('box-alvo');
  const sel = document.getElementById('alvo');
  if (n === 'cons'){ box.hidden = true; }
  else {
    box.hidden = false;
    sel.innerHTML = '';
    if (n === 'tipo'){
      document.getElementById('lbl-alvo').textContent = 'Tipo';
      P.tipos.forEach((t,i) => {
        const o = document.createElement('option');
        o.value = i;
        o.textContent = 'Tipo ' + t.cotipo + ' — ' + t.nome + ' (' + t.n + ' UGs)' +
                        (t.composto ? '  [visão composta]' : '');
        sel.appendChild(o);
      });
    } else {
      document.getElementById('lbl-alvo').textContent = 'Unidade gestora';
      P.ugs.forEach((u,i) => {
        const o = document.createElement('option');
        o.value = i;
        const st = pior(u.res);
        o.textContent = (st==='ERRO'?'! ':'') + u.ug + ' — ' + (u.nome || '(sem nome)');
        sel.appendChild(o);
      });
    }
  }
  pinta();
}

function pior(res){
  let s = 'OK';
  for (const [cod,r] of Object.entries(res)){
    if (ESCOPO[cod] && ESCOPO[cod].escopo === 'consolidado') continue;
    if (r.s === 'ERRO') return 'ERRO';
    if (r.s === 'ALERTA') s = 'ALERTA';
  }
  return s;
}

function fmt(v){
  if (v === null || v === undefined) return '';
  return v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}

function pinta(){
  const sel = document.getElementById('alvo');
  let res, rotulo;
  if (NIVEL === 'cons'){ res = P.consolidado; rotulo = 'GDF consolidado'; }
  else if (NIVEL === 'tipo'){
    const t = P.tipos[sel.value|0]; res = t.res;
    rotulo = 'Tipo ' + t.cotipo + ' — ' + t.nome;
  } else {
    const u = P.ugs[sel.value|0]; res = u.res;
    rotulo = 'UG ' + u.ug + ' — ' + u.nome;
  }

  // KPIs
  const kp = document.getElementById('kpis');
  if (NIVEL === 'cons'){
    let comErro = 0, comAlerta = 0, limpas = 0;
    P.ugs.forEach(u => { const s = pior(u.res);
      if (s==='ERRO') comErro++; else if (s==='ALERTA') comAlerta++; else limpas++; });
    kp.innerHTML =
      card_kpi('e', comErro,  'Unidades com erro') +
      card_kpi('a', comAlerta,'Unidades com alerta') +
      card_kpi('o', limpas,   'Unidades sem apontamento') +
      card_kpi('i', P.ugs.length, 'Unidades avaliadas');
  } else {
    const c = {ERRO:0, ALERTA:0, OK:0, INFO:0};
    Object.entries(res).forEach(([cod,r]) => {
      if (ESCOPO[cod] && ESCOPO[cod].escopo === 'consolidado') return;
      c[r.s] = (c[r.s]||0)+1;
    });
    kp.innerHTML =
      card_kpi('e', c.ERRO,   'Controles com erro') +
      card_kpi('a', c.ALERTA, 'Controles em alerta') +
      card_kpi('o', c.OK,     'Controles OK') +
      card_kpi('i', c.INFO,   'Informativos');
  }

  // cards de controle
  const cont = document.getElementById('conteudo');
  let h = '<h2>' + esc(rotulo) + '</h2>';
  P.controles.forEach(c => {
    const r = res[c.codigo]; if (!r) return;
    const fora = (c.escopo === 'consolidado' && NIVEL !== 'cons');
    h += '<div class="card ' + r.s + (fora ? ' fora' : '') + '">' +
         '<div class="c-top"><span class="chip ' + r.s + '">' + r.s + '</span>' +
         '<span class="cod">' + c.codigo + '</span>' +
         '<span class="tit">' + esc(c.titulo) + '</span>' +
         (c.escopo === 'consolidado'
            ? '<span class="tag' + (c.confirmado ? '' : ' sug') + '">só consolidado' +
              (c.confirmado ? '' : ' (sugerido)') + '</span>' : '') +
         '</div>' +
         (r.d ? '<div class="det">' + esc(r.d) + '</div>' : '') +
         (fora ? '<div class="det">Não conta como problema desta ' +
                 (NIVEL === 'ug' ? 'unidade' : 'fatia') +
                 ': a grandeza só fecha no consolidado.</div>' : '') +
         '</div>';
  });
  cont.innerHTML = h;

  pintaEvo();

  // lista de unidades com apontamento (só no consolidado)
  const hl = document.getElementById('h-lista');
  const lista = document.getElementById('lista');
  if (NIVEL === 'cons'){
    hl.hidden = false;
    const linhas = P.ugs.map((u,i) => ({u, i, s: pior(u.res)}))
                        .filter(x => x.s !== 'OK')
                        .sort((a,b) => (a.s === b.s ? 0 : a.s === 'ERRO' ? -1 : 1));
    const ROT = {erro:'Erro', esperada:'Diferença esperada', verificar:'A verificar'};
    let t = '<table class="tbl"><thead><tr><th>Situação</th><th>UG</th><th>Nome</th>' +
            '<th>Controle</th><th>Equação com os valores</th><th>Norma / legislação</th>' +
            '<th>Classificação</th></tr></thead><tbody>';
    linhas.forEach(x => {
      const maus = Object.entries(x.u.res).filter(([cod,r]) =>
          (r.s==='ERRO'||r.s==='ALERTA') &&
          !(ESCOPO[cod] && ESCOPO[cod].escopo === 'consolidado'));
      maus.forEach(([cod, r], k) => {
        const n = P.normas[cod] || {};
        const cl = (x.u.cls || {})[cod] || {c:'erro', m:''};
        t += '<tr class="cli" onclick="irUG(' + x.i + ')">' +
             '<td><span class="chip ' + r.s + '">' + r.s + '</span></td>' +
             '<td class="n">' + (k ? '' : x.u.ug) + '</td>' +
             '<td>' + (k ? '' : esc(x.u.nome)) + '</td>' +
             '<td class="cod">' + cod + '</td>' +
             '<td class="eq"><b>' + esc(n.equacao || (ESCOPO[cod] ? ESCOPO[cod].titulo : '')) +
               '</b><br>' + esc(r.d || '') + '</td>' +
             '<td class="nm">' + (n.normas || []).map(esc).join('<br>') + '</td>' +
             '<td class="cl ' + cl.c + '"><b>' + ROT[cl.c] + '</b><br>' + esc(cl.m) +
             (cl.orig ? '<br><b>Crédito veio de:</b><br>' + cl.orig.map(o =>
                 esc(o.ug + ' ' + (o.nome || '(sem nome)') + ' — ' + o.tipo + ' ' +
                     fmt(o.v) + ' (' + o.n + ' lanç.)')).join('<br>') : '') + '</td></tr>';
      });
    });
    lista.innerHTML = t + '</tbody></table>';
  } else { hl.hidden = true; lista.innerHTML = ''; }
}


// ── histórico / evolução ────────────────────────────────────────────────────
let EVO_REF = null;   // índice em P.historico do snapshot de comparação
function evoMud(a,b){ return a.s!==b.s || Math.abs((a.v||0)-(b.v||0))>0.009; }
function setRef(i){ EVO_REF = i; pintaEvo(); }
function pintaEvo(){
  const box = document.getElementById('evo');
  const H = P.historico || [];
  if (NIVEL !== 'cons' || H.length < 2){ box.innerHTML=''; return; }
  const atual = H.length-1;
  if (EVO_REF === null || EVO_REF >= atual) EVO_REF = atual-1;

  const W=640, Ht=130, m={l:34,r:12,t:12,b:22};
  const max = Math.max(1, ...H.map(h=>h.n_erro));
  const x = i => m.l + i*(W-m.l-m.r)/(H.length-1);
  const y = v => Ht-m.b - v*(Ht-m.t-m.b)/max;
  let svg = '<svg viewBox="0 0 '+W+' '+Ht+'" role="img" aria-label="Unidades com erro ao longo do tempo">';
  [0, Math.round(max/2), max].forEach(g => {
    svg += '<line class="gr" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(g)+'" y2="'+y(g)+'"/>' +
           '<text class="ax" x="'+(m.l-6)+'" y="'+(y(g)+3)+'" text-anchor="end">'+g+'</text>';
  });
  svg += '<polyline class="ln" points="' + H.map((h,i)=>x(i)+','+y(h.n_erro)).join(' ') + '"/>';
  H.forEach((h,i) => {
    svg += '<circle class="pt'+(i===EVO_REF?' at':'')+'" r="4" cx="'+x(i)+'" cy="'+y(h.n_erro)+
           '" onclick="setRef('+(i===atual?atual-1:i)+')"><title>'+esc(h.gerado)+' — '+
           h.n_erro+' unidade(s) com erro</title></circle>';
  });
  const passo = Math.max(1, Math.ceil(H.length/8));
  H.forEach((h,i) => { if (i%passo===0 || i===atual)
    svg += '<text class="ax" x="'+x(i)+'" y="'+(Ht-6)+'" text-anchor="'+(i===atual?'end':(i===0?'start':'middle'))+'">'+esc(h.gerado.slice(0,5)+' '+h.gerado.slice(11))+'</text>'; });
  svg += '</svg>';

  const ref = H[EVO_REF].ugs, now = H[atual].ugs;
  const linhas = [];
  Object.keys(now).forEach(ug => Object.entries(now[ug].res).forEach(([c,r]) => {
    const o = ref[ug] && ref[ug].res[c];
    const k = !o ? 'novo' : (evoMud(o,r) ? 'mud' : 'per');
    linhas.push({k:k, ug:+ug, nome:now[ug].nome, c:c, a:o||null, b:r});
  }));
  Object.keys(ref).forEach(ug => Object.entries(ref[ug].res).forEach(([c,o]) => {
    if (!(now[ug] && now[ug].res[c])) linhas.push({k:'res', ug:+ug, nome:ref[ug].nome, c:c, a:o, b:null});
  }));
  const ordem = {novo:0, mud:1, res:2, per:3};
  linhas.sort((p,q) => ordem[p.k]-ordem[q.k] || p.ug-q.ug);
  const cont = {novo:0, mud:0, res:0, per:0};
  linhas.forEach(l => cont[l.k]++);
  const ROT = {novo:'Novo', mud:'Valor mudou', res:'Resolvido', per:'Persiste'};
  const cel = r => r ? '<span class="chip '+r.s+'">'+r.s+'</span> '+fmt(r.v) : '—';

  let h = '<div class="evo"><span class="lbl">Evolução dos apontamentos (unidades com erro)</span>' + svg +
    '<div class="sel-linha"><div><span class="lbl">Comparar a situação atual com</span>' +
    '<select onchange="setRef(+this.value)">' +
    H.slice(0,atual).map((q,i) => '<option value="'+i+'"'+(i===EVO_REF?' selected':'')+'>'+
       esc(q.gerado)+' — '+q.n_erro+' un. com erro</option>').join('') +
    '</select></div><div style="font-size:12.5px;color:var(--t2)">' +
    '<b style="color:var(--err)">'+cont.novo+'</b> novos · ' +
    '<b style="color:var(--inf)">'+cont.mud+'</b> mudaram de valor · ' +
    '<b style="color:var(--ok)">'+cont.res+'</b> resolvidos · ' +
    '<b style="color:var(--wrn)">'+cont.per+'</b> persistem</div></div>';
  h += '<table class="tbl" style="margin-top:10px"><thead><tr><th>Mudança</th><th>UG</th><th>Nome</th>' +
       '<th>Controle</th><th>Em '+esc(H[EVO_REF].gerado)+'</th><th>Agora</th></tr></thead><tbody>';
  linhas.forEach(l => {
    h += '<tr><td><span class="dif '+l.k+'">'+ROT[l.k]+'</span></td><td class="n">'+l.ug+'</td>' +
         '<td>'+esc(l.nome)+'</td><td class="cod">'+l.c+'</td><td>'+cel(l.a)+'</td><td>'+cel(l.b)+'</td></tr>';
  });
  if (!linhas.length) h += '<tr><td colspan="6">Sem apontamentos em nenhuma das duas datas.</td></tr>';
  box.innerHTML = h + '</tbody></table></div>';
}

function irUG(i){
  setNivel('ug');
  document.getElementById('alvo').value = i;
  pinta();
  window.scrollTo({top:0, behavior:'smooth'});
}

function card_kpi(cls, n, lbl){
  return '<div class="kpi ' + cls + '"><div class="kpi-n">' + n +
         '</div><div class="kpi-l">' + lbl + '</div></div>';
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

setNivel('cons');
</script>
